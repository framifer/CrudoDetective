  // ================= DAY / NIGHT =================
  // clock in [0,1): 0=midnight, 0.25=6am, 0.5=noon, 0.75=6pm. One full day = DAY_LEN seconds.
  let clock=0.35;                 // start mid-morning
  const DAY_LEN=180;              // seconds for a full day/night cycle
  let dayCount=0;                 // whole days elapsed (advances when the clock passes midnight)
  let seasonAutoTimer=0;          // after the story ends, seasons rotate every SEASON_AUTO_SECS of play
  const SEASON_AUTO_SECS=600;     // 10 minutes of effective play
  function advanceClock(dt){ const nc=clock+dt/DAY_LEN; if(nc>=1){ dayCount+=Math.floor(nc); } clock=nc%1; }
  // 0 = full day, 1 = deep night (used for tinting + lit windows)
  function nightFactor(){
    // dark between ~19:30 (0.81) and ~5:30 (0.23), smooth transitions
    const h=clock;
    if(h>0.27 && h<0.75) return 0;                 // daytime
    if(h>=0.75 && h<0.83) return (h-0.75)/0.08;    // dusk
    if(h>=0.83 || h<0.19) return 1;                // night
    return 1-((h-0.19)/0.08);                      // dawn
  }

  // ================= WEATHER (particles ~50% duty per season) =================
  // spring=wind (drifting petals/breeze), autumn=rain, winter=snow. summer=clear.
  const weather = { on:false, timer:0, phase:6, particles:[] };
  function weatherKind(){ if(season==="winter") return "snow"; if(season==="autumn") return "rain"; if(season==="spring") return "wind"; return "none"; }
  function resetWeather(){ weather.particles.length=0; weather.on=false; weather.timer=0; weather.phase=3+Math.random()*4; }
  function spawnParticles(kind){
    weather.particles.length=0;
    const n = kind==="rain"?70 : kind==="snow"?55 : kind==="wind"?26 : 0;
    for(let i=0;i<n;i++){
      weather.particles.push({ x:Math.random()*(W+40)-20, y:Math.random()*H, s:Math.random()*0.6+0.7, o:Math.random()*Math.PI*2 });
    }
  }
  function updateWeather(dt){
    const kind=weatherKind();
    if(kind==="none"){ weather.on=false; weather.particles.length=0; return; }
    weather.timer+=dt;
    if(weather.timer>=weather.phase){ // toggle on/off -> ~50% duty
      weather.timer=0; weather.phase=4+Math.random()*4; weather.on=!weather.on;
      if(weather.on) spawnParticles(kind); else weather.particles.length=0;
    }
    if(!weather.on) return;
    for(const p of weather.particles){
      if(kind==="rain"){ p.y+=dt*220*p.s; p.x+=dt*40; }
      else if(kind==="snow"){ p.o+=dt*2; p.y+=dt*38*p.s; p.x+=Math.sin(p.o)*dt*22; }
      else if(kind==="wind"){ p.o+=dt*3; p.x+=dt*70*p.s; p.y+=Math.sin(p.o)*dt*18; }
      if(p.y>H+4){ p.y=-4; p.x=Math.random()*(W+40)-20; }
      if(p.x>W+20){ p.x=-20; p.y=Math.random()*H; }
    }
  }
  function drawWeather(){
    if(!weather.on) return;
    const kind=weatherKind();
    if(kind==="rain"){
      ctx.strokeStyle="rgba(180,210,240,0.6)"; ctx.lineWidth=1;
      ctx.beginPath();
      for(const p of weather.particles){ ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-2,p.y+5); }
      ctx.stroke();
      ctx.fillStyle="rgba(40,60,90,0.10)"; ctx.fillRect(0,0,W,H);
    } else if(kind==="snow"){
      ctx.fillStyle="rgba(255,255,255,0.92)";
      for(const p of weather.particles){ const s=p.s>1.1?2:1; ctx.fillRect(Math.round(p.x),Math.round(p.y),s,s); }
    } else if(kind==="wind"){
      // breeze streaks + a few drifting petals/leaves
      ctx.strokeStyle="rgba(255,255,255,0.22)"; ctx.lineWidth=1; ctx.beginPath();
      for(let i=0;i<weather.particles.length;i+=2){ const p=weather.particles[i]; ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+8,p.y-1); }
      ctx.stroke();
      const petal = season==="spring" ? "#f6b8d6" : "#e0a030";
      for(let i=1;i<weather.particles.length;i+=2){ const p=weather.particles[i]; ctx.fillStyle=petal; ctx.fillRect(Math.round(p.x),Math.round(p.y),2,2); }
    }
  }

  // ================= FOG (rolling banks, all seasons, ~independent duty) =================
  // Drifting fog banks that roll in and out regardless of season, for a noir atmosphere.
  const fog = { banks:[], intensity:0, target:0, timer:0, phase:8 };
  function resetFog(){ fog.banks.length=0; fog.intensity=0; fog.target=0.9; fog.timer=0; fog.phase=6+Math.random()*4;
    for(let i=0;i<12;i++){
      fog.banks.push({ x:Math.random()*(W+120)-60, y:Math.random()*H, s:Math.random()*0.6+0.7,
        vx:5+Math.random()*10, w:44+Math.random()*70, h:16+Math.random()*20, o:Math.random()*Math.PI*2 });
    }
  }
  function updateFog(dt){
    // toggle target intensity in/out (~50% duty) so banks roll through then thin out
    fog.timer+=dt;
    if(fog.timer>=fog.phase){ fog.timer=0; fog.phase=7+Math.random()*6; fog.target = fog.target>0.4 ? 0.0 : 0.9; }
    // ease current intensity toward target
    fog.intensity += (fog.target-fog.intensity)*Math.min(1,dt*0.6);
    for(const b of fog.banks){
      b.o+=dt*0.25; b.x+=dt*(b.vx*(0.6+b.s*0.6)); b.y+=Math.sin(b.o)*dt*3;
      if(b.x-b.w>W+60){ b.x=-b.w-Math.random()*40; b.y=Math.random()*H; }
    }
  }
  function drawFog(){
    if(fog.intensity<=0.01) return;
    const gi=fog.intensity;
    // low uniform haze
    ctx.fillStyle="rgba(158,170,180,"+(0.12*gi).toFixed(3)+")"; ctx.fillRect(0,0,W,H);
    // drifting banks
    for(const b of fog.banks){
      ctx.fillStyle="rgba(184,196,204,"+((0.05+0.05*b.s)*gi).toFixed(3)+")";
      ctx.fillRect(Math.round(b.x),Math.round(b.y),Math.round(b.w),Math.round(b.h));
    }
  }
  resetFog();

  // ---- CONFRONT: phased "verbal boss": beat the suspect's resistance with the right proofs ----
  // confront = { active, id, res, comp, options:[{label,key,good}], sel, msg, msgT, onWin, onLose }
  // Per-quest custom line for a story beat: returns cs_<id>_<key> if defined, else "" (caller falls back).
  function csvar(id, key){ if(!id) return ""; const k="cs_"+id+"_"+key; const v=t(k); return (v===k)? "" : v; }
  const confront={ active:false, id:null, caseId:null, res:100, comp:100, options:[], sel:0, msg:"", msgT:0, onWin:null, onLose:null, endT:0, ended:null };
  function startConfront(id, goodKeys, onWin, onLose){
    // options = collected clues; the "good" ones (goodKeys) chip the suspect's resistance
    const opts=[];
    (CASE.order||[]).forEach(k=>{ const c=CASE.clues[k]; if(c&&c.taken){ const d=t("cs_"+k+"_clue"); if(d!=="cs_"+k+"_clue") opts.push({label:trim(d), key:k, good:goodKeys.indexOf(k)>=0}); } });
    confront.caseId=id;
    runConfront(opts, onWin, onLose, csvar(id,"confront_intro")||t("confront_intro"));
  }
  // Generic confront core (reused by the central case AND by side quests with their own arguments).
  function runConfront(options, onWin, onLose, introMsg){
    confront.active=true; confront.id=null; confront.res=100; confront.comp=100; confront.options=options; confront.sel=0;
    confront.msg=introMsg||t("confront_intro"); confront.msgT=2.2; confront.onWin=onWin; confront.onLose=onLose; confront.endT=0; confront.ended=null;
    SFX.talk();
  }
  function updateConfront(dt){
    if(confront.msgT>0) confront.msgT-=dt;
    if(confront.ended){ confront.endT-=dt; if(confront.endT<=0){ const cb=confront.ended==="win"?confront.onWin:confront.onLose; confront.active=false; if(cb) cb(); } return; }
    if(consumePress("up")){ confront.sel=(confront.sel-1+confront.options.length)%confront.options.length; SFX.up&&SFX.up(); }
    if(consumePress("down")){ confront.sel=(confront.sel+1)%confront.options.length; SFX.down&&SFX.down(); }
    if(consumePress("a")){
      const opt=confront.options[confront.sel];
      if(opt.good){ confront.res=Math.max(0, confront.res-35); confront.msg=csvar(confront.caseId,"confront_hit")||vpick("confront_hit")[0]||"..."; confront.msgT=1.8; SFX.confirm();
        if(confront.res<=0){ confront.msg=csvar(confront.caseId,"confront_win")||t("confront_win"); confront.msgT=1.6; confront.ended="win"; confront.endT=1.6; SFX.questDone&&SFX.questDone(); }
      } else { confront.comp=Math.max(0, confront.comp-25); confront.res=Math.min(100, confront.res+8); confront.msg=csvar(confront.caseId,"confront_miss")||vpick("confront_miss")[0]||"..."; confront.msgT=1.8; SFX.cancel();
        if(confront.comp<=0){ confront.msg=t("confront_lose"); confront.msgT=1.6; confront.ended="lose"; confront.endT=1.6; }
      }
    }
  }
  function drawConfront(){
    // dim background
    ctx.fillStyle="rgba(6,8,12,0.55)"; ctx.fillRect(0,0,W,H);

    text(t("confront_suspect"), 8, 6, "#ff8a6a"); bar(8,16,W-16,6, confront.res/100, "#d83a3a", "#3a1e1e");
    text(t("confront_you"), 8, 28, "#8ad0ff"); bar(8,38,W-16,6, confront.comp/100, "#3a8ad0", "#1e2a3a");
    // message line
    if(confront.msgT>0){ panelBox(6,50,W-12,16); textCenter(confront.msg, W/2, 55, pal().accent); }
    // options menu
    const opts=confront.options; const n=Math.min(opts.length,5); const bh=14+n*11; const by=H-bh-4;
    panelBox(6,by,W-12,bh); text(t("confront_q"),12,by+4,"#f0d840");
    // show a window of options around sel
    let start=Math.max(0, Math.min(confront.sel-2, opts.length-n));
    for(let i=0;i<n;i++){ const o=opts[start+i]; const sel=(start+i)===confront.sel; text((sel?"> ":"  ")+o.label, 14, by+16+i*11, sel?pal().accent:"#c8c8d0"); }

  // ---- FIGHT (Zelda-like scripted duel): move + attack (A) + dodge (B), HP bars ----
  // Arena in screen space. Rare, story-scripted encounters only.
  const AR = { x:16, y:52, w:W-32, h:H-84 };   // arena rectangle
  const fight = { active:false, id:null, onWin:null,
    px:0, py:0, pdir:"down", php:100, patk:0, pdodge:0, pinv:0, phit:0,
    ex:0, ey:0, ehp:100, etimer:0, elunge:0, ehit:0, msg:"", msgT:0, endT:0, ended:null };
  function startFight(id, onWin){
    fight.active=true; fight.id=id; fight.onWin=onWin;
    fight.px=AR.x+20; fight.py=AR.y+AR.h/2; fight.pdir="right"; fight.php=100; fight.patk=0; fight.pdodge=0; fight.pinv=0; fight.phit=0;
    fight.ex=AR.x+AR.w-24; fight.ey=AR.y+AR.h/2; fight.ehp=100; fight.etimer=1.2; fight.elunge=0; fight.ehit=0;
    fight.msg=csvar(id,"fight_intro")||t("fight_intro"); fight.msgT=2.0; fight.endT=0; fight.ended=null;
    SFX.talk();
  }
  function updateFight(dt){
    if(fight.msgT>0) fight.msgT-=dt;
    if(fight.ended){ fight.endT-=dt; if(fight.endT<=0){ if(fight.ended==="win"){ const cb=fight.onWin; fight.active=false; if(cb) cb(); } else { startFight(fight.id, fight.onWin); } } return; }
    const PSPD=70;
    // player movement
    let mvx=0,mvy=0;
    if(keys.left){mvx=-1;fight.pdir="left";} else if(keys.right){mvx=1;fight.pdir="right";}
    if(keys.up){mvy=-1;fight.pdir="up";} else if(keys.down){mvy=1;fight.pdir="down";}
    // dodge dash
    if(fight.pdodge>0){ fight.pdodge-=dt; fight.pinv=Math.max(fight.pinv, 0.02); }
    const spd = fight.pdodge>0 ? PSPD*2.4 : PSPD;
    fight.px=Math.max(AR.x+6, Math.min(AR.x+AR.w-6, fight.px+mvx*spd*dt));
    fight.py=Math.max(AR.y+6, Math.min(AR.y+AR.h-6, fight.py+mvy*spd*dt));
    if(fight.pinv>0) fight.pinv-=dt;
    if(fight.phit>0) fight.phit-=dt;
    if(fight.ehit>0) fight.ehit-=dt;
    if(fight.patk>0) fight.patk-=dt;
    // attack (A): short reach in facing direction
    if(consumePress("a") && fight.patk<=0){ fight.patk=0.22; SFX.b&&SFX.b();
      const range=16; let ax=fight.px, ay=fight.py;
      if(fight.pdir==="left")ax-=range; else if(fight.pdir==="right")ax+=range; else if(fight.pdir==="up")ay-=range; else ay+=range;
      if(Math.abs(ax-fight.ex)<12 && Math.abs(ay-fight.ey)<12){ fight.ehp=Math.max(0,fight.ehp-18); fight.ehit=0.2;
        if(fight.ehp<=0){ fight.msg=csvar(fight.id,"fight_win")||t("fight_win"); fight.msgT=1.6; fight.ended="win"; fight.endT=1.6; SFX.questDone&&SFX.questDone(); }
      }
    }
    // dodge (B)
    if(consumePress("b") && fight.pdodge<=0){ fight.pdodge=0.18; fight.pinv=0.3; SFX.confirm(); }
    // enemy AI: chase, then lunge periodically
    if(fight.elunge>0){ fight.elunge-=dt;
      // during lunge, dash toward last player pos
      fight.ex+=fight.elvx*dt; fight.ey+=fight.elvy*dt;
    } else {
      const dx=fight.px-fight.ex, dy=fight.py-fight.ey; const d=Math.hypot(dx,dy)||1;
      fight.ex+=dx/d*40*dt; fight.ey+=dy/d*40*dt;
      fight.etimer-=dt;
      if(fight.etimer<=0){ fight.etimer=1.4+Math.random()*0.8; fight.elunge=0.35; const dd=Math.hypot(dx,dy)||1; fight.elvx=dx/dd*160; fight.elvy=dy/dd*160; }
    }
    fight.ex=Math.max(AR.x+6, Math.min(AR.x+AR.w-6, fight.ex));
    fight.ey=Math.max(AR.y+6, Math.min(AR.y+AR.h-6, fight.ey));
    // enemy hits player on contact (unless dodging/invulnerable)
    if(Math.abs(fight.px-fight.ex)<10 && Math.abs(fight.py-fight.ey)<10 && fight.pinv<=0 && fight.phit<=0){
      fight.php=Math.max(0, fight.php-12); fight.phit=0.6; fight.pinv=0.4; SFX.cancel();
      if(fight.php<=0){ fight.msg=t("fight_lose"); fight.msgT=1.6; fight.ended="lose"; fight.endT=1.6; }
    }
  }
  function drawFight(){
    ctx.fillStyle="rgba(6,8,12,0.7)"; ctx.fillRect(0,0,W,H);
    // arena floor
    ctx.fillStyle="#1a1a22"; ctx.fillRect(AR.x,AR.y,AR.w,AR.h);
    ctx.strokeStyle="#3a3a48"; ctx.lineWidth=1; ctx.strokeRect(AR.x+0.5,AR.y+0.5,AR.w-1,AR.h-1);
    // HP bars
    function bar(x,y,w,frac,col){ ctx.fillStyle="#0a0a12"; ctx.fillRect(x-1,y-1,w+2,6); ctx.fillStyle="#3a1e1e"; ctx.fillRect(x,y,w,4); ctx.fillStyle=col; ctx.fillRect(x,y,Math.round(w*Math.max(0,frac)),4); }
    text(t("fight_you"),8,4,"#8ad0ff"); bar(8,14,70,fight.php/100,"#3a8ad0");
    text(t("fight_enemy"),W-64,4,"#ff8a6a"); bar(W-64,14,56,fight.ehp/100,"#d83a3a");
    // enemy (red-ish thug)
    const eflash=fight.ehit>0 && Math.floor(performance.now()/60)%2===0;
    drawHuman(fight.ex-8, fight.ey-16, "left", true, Math.floor(performance.now()/150)%2, {skin:"#e0b080",hair:"#1a1a1a",shirt:eflash?"#ffffff":"#7a2a2a",shirtDk:"#5a1e1e",pants:"#2a2028",kind:"ym"});
    // player (detective), flashing if hit
    const pflash=fight.phit>0 && Math.floor(performance.now()/60)%2===0;
    if(!pflash) drawHuman(fight.px-8, fight.py-16, fight.pdir, (keys.left||keys.right||keys.up||keys.down), Math.floor(performance.now()/150)%2, {skin:"#f0c890",hair:"#2a2018",shirt:"#1a1a1e",shirtDk:"#0e0e12",pants:"#2f4d78",kind:"ym"});
    // attack flash
    if(fight.patk>0.1){ ctx.fillStyle="#fff2a0"; let ax=fight.px, ay=fight.py; const r=14;
      if(fight.pdir==="left")ax-=r; else if(fight.pdir==="right")ax+=r; else if(fight.pdir==="up")ay-=r; else ay+=r;
      ctx.fillRect(ax-3,ay-3,6,6); }
    if(fight.msgT>0){ panelBox(6,H-20,W-12,16); textCenter(fight.msg,W/2,H-16,pal().accent); }
    else textCenter(t("fight_hint"),W/2,H-12,"#8a8a9a");
  }

  // ================= SAVE / LOAD =================
  const SAVE_KEY="crudoRPG.save.v2";
  function serializeCase(){ const cl={}; if(window.CASE_REF){ for(const id in window.CASE_REF.clues){ cl[id]=window.CASE_REF.clues[id].taken?1:0; } } return {clues:cl, introDone: window.CASE_REF? (window.CASE_REF.introDone?1:0):0, closedUntil: window.CASE_REF? window.CASE_REF.closedUntil : {}, deduced: window.CASE_REF? window.CASE_REF.deduced : {}, reconstructed: window.CASE_REF? window.CASE_REF.reconstructed : {}, morals: window.CASE_REF? window.CASE_REF.morals : {}, fought: window.CASE_REF? window.CASE_REF.fought : {}, chaseCaught: window.CASE_REF? window.CASE_REF.chaseCaught : {}}; }
  function restoreCase(o){ if(!o||!window.CASE_REF) return; if(o.clues){ for(const id in o.clues){ if(window.CASE_REF.clues[id]) window.CASE_REF.clues[id].taken=!!o.clues[id]; } } window.CASE_REF.introDone=!!o.introDone; window.CASE_REF.closedUntil = o.closedUntil||{}; window.CASE_REF.deduced = o.deduced||{}; window.CASE_REF.reconstructed = o.reconstructed||{}; window.CASE_REF.morals = o.morals||{}; window.CASE_REF.fought = o.fought||{}; window.CASE_REF.chaseCaught = o.chaseCaught||{}; }
  function saveGame(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify({areaKey,tx:player.tx,ty:player.ty,dir:player.dir,scooter:player.scooter,boat:player.boat,scooterUnlocked,islandUnlocked,discovered:[...discovered],seaDone,season,dayCount,questState,catFound:cat.found,shellQuest,shellFound:shell.found,bikeTaken:bike.taken,ballTaken:ball.taken,keyringTaken:keyring.taken,photos:photos.map(p=>p.taken),lang,chapter,flags,quests:serializeQuests(),cs:serializeCase(),sq:(typeof serializeSQ==="function"?serializeSQ():null)})); return true;}catch(e){return false;} }
  function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;} }
  function loadGame(){ try{ const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null"); if(!d) return false;
    areaKey=d.areaKey&&AREAS[d.areaKey]?d.areaKey:"town"; useMap(AREAS[areaKey]);
    player.tx=d.tx!=null?d.tx:15; player.ty=d.ty!=null?d.ty:12; player.px=player.tx*TILE; player.py=player.ty*TILE; player.dir=d.dir||"down";
    season=d.season||"spring"; dayCount=d.dayCount||0; questState=d.questState||0; cat.found=!!d.catFound; shellQuest=d.shellQuest||0; shell.found=!!d.shellFound; bike.taken=!!d.bikeTaken; if(d.lang) lang=d.lang;
    ball.taken=!!d.ballTaken; keyring.taken=!!d.keyringTaken; if(d.photos) photos.forEach((p,i)=>p.taken=!!d.photos[i]);
    chapter=d.chapter||1; for(const f in flags) delete flags[f]; if(d.flags) Object.assign(flags,d.flags); if(d.seaDone){ for(const k in seaDone) delete seaDone[k]; Object.assign(seaDone,d.seaDone); } restoreQuests(d.quests); restoreCase(d.cs); restoreSQ(d.sq); sqInit();
    player.swimming=false; player.scooter=false;

    player.boat = !!d.boat || areaKey==="opensea";
    // anti-stuck safety: if we're on a water tile in a sea area but not in the boat, put the player back in the boat
    if(!player.boat && (areaKey==="opensea"||areaKey==="island"||areaKey==="cape") && tileAt(player.tx,player.ty)==="~"){ player.boat=true; }
    scooterUnlocked=!!d.scooterUnlocked; islandUnlocked=!!d.islandUnlocked; discovered.clear(); discovered.add("town"); (d.discovered||[]).forEach(a=>discovered.add(a)); discovered.add(areaKey); resetWeather(); return true;}catch(e){return false;} }
  function resetProgress(){ areaKey="town"; useMap(TOWN); player.tx=21; player.ty=31; player.px=21*TILE; player.py=31*TILE; player.dir="up"; player.moving=false;
    season="spring"; dayCount=0; scooterUnlocked=false; islandUnlocked=false; discovered.clear(); discovered.add("town"); player.scooter=false; player.boat=false; if(typeof seaDone!=="undefined"){ for(const k in seaDone) delete seaDone[k]; } questState=0; cat.found=false; shellQuest=0; shell.found=false; bike.taken=false; ball.taken=false; keyring.taken=false; photos.forEach(p=>p.taken=false); insideKey=null; if(window.CASE_REF){ window.CASE_REF.closedUntil={}; window.CASE_REF.deduced={}; window.CASE_REF.reconstructed={}; window.CASE_REF.morals={}; window.CASE_REF.fought={}; window.CASE_REF.chaseCaught={}; } if(window.SQ_REF){ SQ.done={}; SQ_KINDS.forEach(k=>SQ.queueIdx[k]=0); } resetQuests(); resetWeather(); sqInit(); saveGame(); }

  // ================= MENU =================
  const menu = { open:false, index:0, showMap:false, showJournal:false, showNotebook:false };
  const mapNav = { zoom:null, col:1, row:1 };   // zoom=null -> grid view; else zoomed area key
  const MENU_KEYS = ["menu_journal","menu_notebook","menu_map","menu_lang","menu_close"];
  function openMenu(){ menu.open=true; menu.index=0; menu.showMap=false; menu.showJournal=false; menu.showNotebook=false; SFX.confirm(); }
  function closeMenu(){ menu.open=false; menu.showMap=false; menu.showJournal=false; menu.showNotebook=false; SFX.cancel(); }
  function updateMenu(dt){
    if(menu.showMap){
      if(mapNav.zoom){
        // zoomed into one area: B goes back to the grid
        if(consumePress("b")||consumePress("a")||consumePress("start")){ mapNav.zoom=null; SFX.cancel(); }
        return;
      }
      // grid view: move selection with the d-pad
      if(consumePress("left")){ do{ mapNav.col=(mapNav.col+2)%3; }while(!AREA_GRID[mapNav.col+","+mapNav.row]); SFX.up&&SFX.up(); }
      if(consumePress("right")){ do{ mapNav.col=(mapNav.col+1)%3; }while(!AREA_GRID[mapNav.col+","+mapNav.row]); SFX.up&&SFX.up(); }
      if(consumePress("up")){ do{ mapNav.row=(mapNav.row+2)%3; }while(!AREA_GRID[mapNav.col+","+mapNav.row]); SFX.up&&SFX.up(); }
      if(consumePress("down")){ do{ mapNav.row=(mapNav.row+1)%3; }while(!AREA_GRID[mapNav.col+","+mapNav.row]); SFX.up&&SFX.up(); }
      if(consumePress("a")){ const k=AREA_GRID[mapNav.col+","+mapNav.row]; if(k){ mapNav.zoom=k; SFX.confirm(); } return; }
      if(consumePress("b")||consumePress("start")){ menu.showMap=false; SFX.cancel(); }
      return;
    }
    if(menu.showJournal){ if(consumePress("b")||consumePress("start")){ menu.showJournal=false; SFX.cancel(); } return; }
    if(menu.showNotebook){ if(consumePress("b")||consumePress("start")){ menu.showNotebook=false; SFX.cancel(); } return; }
    if(consumePress("up")) { menu.index=(menu.index-1+MENU_KEYS.length)%MENU_KEYS.length; SFX.up&&SFX.up(); }
    if(consumePress("down")) { menu.index=(menu.index+1)%MENU_KEYS.length; SFX.down&&SFX.down(); }
    if(consumePress("b")||consumePress("start")){ closeMenu(); return; }
    if(consumePress("a")){
      const k=MENU_KEYS[menu.index];
      if(k==="menu_journal"){ menu.showJournal=true; SFX.confirm(); }
      else if(k==="menu_notebook"){ menu.showNotebook=true; SFX.confirm(); }
      else if(k==="menu_map"){ menu.showMap=true; mapNav.zoom=null; const gp=gridPosOf(areaKey); mapNav.col=gp[0]; mapNav.row=gp[1]; SFX.confirm(); }
      else if(k==="menu_lang"){ toggleLang(); }
      else { closeMenu(); }
    }
  }

  // ================= UPDATE =================
  function update(dt){
    if(screen==="title") updateTitle(dt);
    else if(screen==="overworld"){ if(menu.open) updateMenu(dt); else updateWorld(dt); }
    if(seasonPopup>0) seasonPopup-=dt;
    if(bannerT>0) bannerT-=dt;
    if(questPopT>0) questPopT-=dt;
    if(screen==="overworld" && !insideKey && !menu.open){ updateWeather(dt); updateFog(dt); advanceClock(dt);
      // post-story: seasons rotate on their own every 10 minutes of effective play
      if(caseAllDone()){ seasonAutoTimer+=dt; if(seasonAutoTimer>=SEASON_AUTO_SECS){ seasonAutoTimer=0; cycleSeason(); } }
    }
  }
  function updateTitle(dt){
    const options=hasSave()?2:1;
    if(consumePress("up")) titleIndex=(titleIndex-1+options)%options;
    if(consumePress("down")) titleIndex=(titleIndex+1)%options;
    if(consumePress("select")) toggleLang();
    if(consumePress("a")){ SFX.confirm(); if(hasSave()&&titleIndex===0) loadGame(); else resetProgress(); SFX.setTrack("noir"); if(!SFX.musicPlaying()) SFX.startMusic("noir"); screen="overworld"; }
    else if(consumePress("start")){ toggleLang(); }
  }
  function facingTile(){ let fx=player.tx,fy=player.ty; if(player.dir==="up")fy--; else if(player.dir==="down")fy++; else if(player.dir==="left")fx--; else if(player.dir==="right")fx++; return {fx,fy}; }
  function npcAt(tx,ty){
    if(insideKey){ const inpc=currentInteriorNpc(); if(inpc && inpc.tx===tx && inpc.ty===ty) return inpc; return null; }
    return currentNpcs().find(n=>Math.round(n.px/TILE)===tx && Math.round(n.py/TILE)===ty);
  }
  function opposite(d){ return {up:"down",down:"up",left:"right",right:"left"}[d]; }

  function enterInterior(key,outX,outY){ returnArea=areaKey; insideKey=key; outsideReturn={tx:outX,ty:outY};
    useMap(INTERIORS[key].rows); const sp=INTERIORS[key].spawn; player.tx=sp.tx; player.ty=sp.ty; player.px=sp.tx*TILE; player.py=sp.ty*TILE; player.dir="up"; player.moving=false; SFX.door(); }
  function exitInterior(){ insideKey=null; areaKey=returnArea||"town"; useMap(AREAS[areaKey]); player.tx=outsideReturn.tx; player.ty=outsideReturn.ty; player.px=player.tx*TILE; player.py=player.ty*TILE; player.dir="down"; player.moving=false; outsideReturn=null; SFX.door(); saveGame(); }

  function updateWorld(dt){
    player.animT+=dt; cat.animT+=dt; shell.animT+=dt;
    if(player.scooter && SFX.scooterRev) SFX.scooterRev(player.moving);
    if(mauling.active){ updateMauling(dt); return; }   // freeze the world during the attack fade
    if(!insideKey && chase.active) updateChase(dt);
    if(areaKey==="opensea"){ updateSeaCurrent(dt); if(regatta.active) updateRegatta(dt); if(recovery.active) updateRecovery(dt); }
    if(!insideKey && typeof scDeliv!=="undefined" && scDeliv.active) updateScDelivery(dt);
    if(!insideKey && typeof courier!=="undefined" && courier.active) updateCourier(dt);
    if(!insideKey){ maybeStartTail(); if(tail.active) updateTail(dt); }
    // spawn/refresh ambient fauna when the outdoor area changes; clear it indoors
    if(insideKey){ if(faunaArea!==null){ fauna=[]; faunaArea=null; } }
    else if(faunaArea!==areaKey){ spawnFauna(areaKey); faunaArea=areaKey; discoverArea(areaKey); }
    if(!insideKey && fauna.length) updateFauna(dt);
    if(!insideKey){ updateNpcs(dt);
      if(inTown()){ updateAnimals(dt);
        for(const s of swimmers){ s.animT+=dt; s.x+=s.dir*s.sp*dt; if(s.x<=s.x0){ s.x=s.x0; s.dir=1; } else if(s.x>=s.x1){ s.x=s.x1; s.dir=-1; } }
      }
      if(holidayBeachOn()){
        for(const s of holidaySwimmers){ s.animT+=dt; s.x+=s.dir*s.sp*dt; if(s.x<=s.x0){ s.x=s.x0; s.dir=1; } else if(s.x>=s.x1){ s.x=s.x1; s.dir=-1; } }
        updateBeachGames(dt);
      }
      for(const b of currentBuoys()) b.animT+=dt;
      if(areaKey==="mountain" && season==="winter") updateSkiers(dt);
    }

    // fishing activity: 5-second rod animation, no input except waiting
    if(fishing.active){ fishing.t+=dt; if(fishing.t>=5){ fishing.active=false; banner(t("fishing_done")); SFX.pickup(); } return; }
    // interrogation multiple-choice
    if(fight.active){ updateFight(dt); return; }
    if(fishSkill.active){ updateFishingSkill(dt); return; }
    if(confront.active){ updateConfront(dt); return; }
    if(choice.active){ updateChoice(); return; }
    // yes/no prompt
    if(prompt2.active){
      if(consumePress("left")||consumePress("right")||consumePress("up")||consumePress("down")) prompt2.sel=prompt2.sel?0:1;
      if(consumePress("a")){ const y=prompt2.sel===0; prompt2.active=false; SFX.confirm(); if(y && prompt2.yes) prompt2.yes(); }
      else if(consumePress("b")){ prompt2.active=false; SFX.cancel(); }
      return;
    }

    if(dialog.active){ dialog.reveal+=dt*48; if(consumePress("a")||consumePress("start")||consumePress("b")) advanceDialog(); return; }
    if(consumePress("start")){ openMenu(); return; }     // START opens menu
    if(consumePress("select")){ toggleScooter(); return; }   // SELECT toggles the scooter

    if(consumePress("a")){
      const {fx,fy}=facingTile();
      const n=npcAt(fx,fy);
      if(n){ if(n.dir!==undefined) n.dir=opposite(player.dir);
        const sqm = (typeof sqNpcMission==="function") ? sqNpcMission(n.id) : null;
        const storyActive = (typeof caseActiveFor==="function" && caseActiveFor(n.id)) || (typeof introActiveFor==="function" && introActiveFor(n.id)) || npcHasQuest(n);
        if(sqm && !storyActive){ showExamine((sqm.giver&&sqm.giver[lang])||["..."], ()=>sqStart(sqm)); return; }
        openDialog(n); return; }
      const fc=tileAt(fx,fy);
      // board the ship: standing at the end of the pier, facing the moored ferry
      if(inTown() && !insideKey && Math.abs(fx-ship.tx)<=2 && Math.abs(fy-ship.ty)<=2){ openShipMenu(); SFX.confirm(); return; }
      // metal raft at the industrial SE shore: A to sail straight into the island waters (once unlocked)
      if(areaKey==="industrial" && !insideKey && Math.abs(fx-raft.tx)<=1 && Math.abs(fy-raft.ty)<=1){
        enterIslandWaters("industrial"); SFX.confirm(); return;
      }
      // island signpost: read a warning about the cult
      if(areaKey==="island" && !insideKey && fc==="P"){ showExamine(t("sign_island")); SFX.confirm&&SFX.confirm(); return; }
      if(areaKey==="cape" && !insideKey && fc==="P"){ showExamine(t("sign_cape")); SFX.confirm&&SFX.confirm(); return; }
      // island temple: enter through the door
      if(areaKey==="island" && !insideKey && !player.boat && fc==="D"){ enterInterior("temple", player.tx, player.ty); return; }
      if(areaKey==="island" && !insideKey){
        if(player.boat && fc==="w"){ player.boat=false; player.tx=fx; player.ty=fy; player.px=fx*TILE; player.py=fy*TILE; SFX.door&&SFX.door(); banner(t("island_land")); saveGame(); return; }
        if(!player.boat && tileAt(player.tx,player.ty)==="w" && fc==="~"){ player.boat=true; player.tx=fx; player.ty=fy; player.px=fx*TILE; player.py=fy*TILE; SFX.door&&SFX.door(); banner(t("island_board")); saveGame(); return; }
      }
      // cape dock: same land/board logic as the island
      if(areaKey==="cape" && !insideKey){
        if(player.boat && fc==="w"){ player.boat=false; player.tx=fx; player.ty=fy; player.px=fx*TILE; player.py=fy*TILE; SFX.door&&SFX.door(); banner(t("island_land")); saveGame(); return; }
        if(!player.boat && tileAt(player.tx,player.ty)==="w" && fc==="~"){ player.boat=true; player.tx=fx; player.ty=fy; player.px=fx*TILE; player.py=fy*TILE; SFX.door&&SFX.door(); banner(t("island_board")); saveGame(); return; }
      }
      if(!insideKey && inTown() && DOORS[fc]){ enterInterior(DOORS[fc].interior, DOORS[fc].outX, DOORS[fc].outY); return; }
      if(!insideKey && !inTown() && (/[1-9]/.test(fc)) && AREA_INTERIOR[areaKey]){
        const ai=AREA_INTERIOR[areaKey];
        const interior = (typeof ai==="string") ? ai : ai[fc];
        if(interior){ enterInterior(interior, player.tx, player.ty); return; }
      }
      if(insideKey && fc==="e"){ exitInterior(); return; }
      if(!insideKey && !cat.found && questState>=1 && fx===cat.tx && fy===cat.ty){ cat.found=true; questState=2; SFX.meow(); SFX.pickup(); banner(t("found_cat")); saveGame(); return; }
      if(!insideKey && !shell.found && shellQuest>=1 && fx===shell.tx && fy===shell.ty){ shell.found=true; shellQuest=2; SFX.pickup(); banner(t("found_shell")); saveGame(); return; }
      if(!insideKey && !ball.taken && QUESTS.kids.status==="active" && QUESTS.kids.step>=1 && fx===ball.tx && fy===ball.ty){ ball.taken=true; SFX.pickup(); QUESTS.kids.step=2; banner(t("ball_found")); saveGame(); return; }
      if(!insideKey && !keyring.taken && QUESTS.oldfriend.status==="active" && fx===keyring.tx && fy===keyring.ty){ keyring.taken=true; setFlag("keyring"); SFX.pickup(); banner(t("keyring_found")); saveGame(); return; }
      if(!insideKey && (QUESTS.photos.status==="active"||QUESTS.photos.status==="available")){ for(const ph of photos){ if(!ph.taken && fx===ph.tx && fy===ph.ty){ ph.taken=true; SFX.pickup(); if(QUESTS.photos.status==="available") qStart("photos"); banner(t("photo_found")); if(photosFound()>=3){ qComplete("photos"); banner(t("photos_msg")); } saveGame(); return; } } }
      if(!insideKey && typeof tryPickupClue==="function" && tryPickupClue(fx,fy)){ return; }
    }

    if(!player.moving){
      let ntx=player.tx,nty=player.ty,nd=player.dir,want=false;
      if(keys.up){nty--;nd="up";want=true;} else if(keys.down){nty++;nd="down";want=true;}
      else if(keys.left){ntx--;nd="left";want=true;} else if(keys.right){ntx++;nd="right";want=true;}
      if(want){ player.dir=nd;
        // edge crossing to a neighbor area (screen transition)
        if(!insideKey && (ntx<0||ntx>=cur.w||nty<0||nty>=cur.h)){
          let dir=null; if(nty<0) dir="N"; else if(nty>=cur.h) dir="S"; else if(ntx<0) dir="W"; else if(ntx>=cur.w) dir="E";
          if(areaKey==="opensea"){
            if(dir==="N"){ leaveOpenSea(); return; }        // north edge returns to the pier
            if(dir==="E"){ enterIslandWaters("opensea"); return; }   // sail east to reach the cult island
            if(dir==="W"){ enterCapeWaters(); return; }     // sail west to reach the cape (SW)
            return;   // other edges = open water wall
          }
          if(areaKey==="island"){
            if(dir==="W" && player.boat){ islandToOpenSea(); return; }      // WEST edge -> Open Sea
            if(dir==="N" && player.boat){ islandToIndustrial(); return; }   // NORTH edge -> raft pier (Industry District)
            return;   // other edges (E/S) = open water wall
          }
          if(areaKey==="cape"){
            if(dir==="E" && player.boat){ capeToOpenSea(); return; }   // sail east back to the Open Sea
            if(player.boat) return;   // in the boat, all other edges are open-water walls (holiday is on foot only)
            // on foot: NORTH edge falls through to neighborArea -> holiday
          }
          const nb=neighborArea(dir);
          if(nb && ISOLATED_AREAS.has(nb)) return;   // island/open sea: reachable only by ship
          if(nb){
            let ex=player.tx, ey=player.ty;
            if(dir==="N") ey=cur.h-1; else if(dir==="S") ey=0; else if(dir==="W") ex=cur.w-1; else if(dir==="E") ex=0;
            // clamp entry into walkable range near the edge
            switchArea(nb, ex, ey);
          }
          return; // don't fall through to tryMove
        }
        if(tryMove(ntx,nty)) { player.moving=true; }
      }
    } else {
      const footSpeed = keys.a ? SNEAK_SPEED : (keys.b ? RUN_SPEED : MOVE_SPEED);   // hold A=sneak, B=run
      const tX=player.tx*TILE,tY=player.ty*TILE,st=(player.boat?BOAT_SPEED:(player.swimming?MOVE_SPEED*0.62:(player.scooter?SCOOTER_SPEED:footSpeed)))*dt;
      if(player.px<tX)player.px=Math.min(tX,player.px+st); if(player.px>tX)player.px=Math.max(tX,player.px-st);
      if(player.py<tY)player.py=Math.min(tY,player.py+st); if(player.py>tY)player.py=Math.max(tY,player.py-st);
      if(player.px===tX&&player.py===tY){ player.moving=false; if(insideKey && tileAt(player.tx,player.ty)==="e"){ exitInterior(); return; } if(!insideKey && !player.swimming) saveGame(); }
    }
    updateCamera();
  }

  // A collectible item sitting on a tile blocks movement (you bump into it and pick it up with A),
  // instead of walking over it. Covers story clues + the original micro-quest items.
  function isCollectibleBlocking(tx,ty){
    if(insideKey) return false;
    // story clues currently active in this area (tail beats have no physical pickup -> excluded)
    if(typeof currentClues==="function"){
      for(const {c} of currentClues()){ if(c.tx===tx && c.ty===ty) return true; }
    }
    // micro-quest items
    if(!cat.found && questState>=1 && tx===cat.tx && ty===cat.ty) return true;
    if(!shell.found && shellQuest>=1 && tx===shell.tx && ty===shell.ty) return true;
    if(typeof ball!=="undefined" && !ball.taken && QUESTS.kids && QUESTS.kids.status==="active" && QUESTS.kids.step>=1 && tx===ball.tx && ty===ball.ty) return true;
    if(typeof keyring!=="undefined" && !keyring.taken && QUESTS.oldfriend && QUESTS.oldfriend.status==="active" && tx===keyring.tx && ty===keyring.ty) return true;
    if(typeof photos!=="undefined" && QUESTS.photos && (QUESTS.photos.status==="active"||QUESTS.photos.status==="available")){
      for(const ph of photos){ if(!ph.taken && tx===ph.tx && ty===ph.ty) return true; }
    }
    return false;
  }

  // Handle a step attempt; returns true if the move starts. Manages swimming + buoys + messages.
  function tryMove(ntx,nty){
    const target=tileAt(ntx,nty);
    if(npcAt(ntx,nty) || (!insideKey && isCollectibleBlocking(ntx,nty))) return false;   // bump into pickups, don't walk over them

    // ---- OPEN SEA: free boat navigation over water ----
    if(areaKey==="opensea" && !insideKey){
      if(target==="~"){ player.tx=ntx; player.ty=nty; SFX.step&&SFX.step(); return true; }
      return false;   // no land in the open sea
    }
    // ---- ISLAND: in the boat you move over water only; on foot the dock/land is walkable ----
    if(areaKey==="island" && !insideKey && player.boat){
      if(target==="~"){ player.tx=ntx; player.ty=nty; SFX.step&&SFX.step(); return true; }
      return false;   // boat can't ride onto land/dock; use A at the dock to land
    }
    // ---- CAPE: same rule as the island for the boat over its eastern/southern waters ----
    if(areaKey==="cape" && !insideKey && player.boat){
      if(target==="~"){ player.tx=ntx; player.ty=nty; SFX.step&&SFX.step(); return true; }
      return false;   // dock with A to land
    }
    // ---- SEA / SWIMMING (town & holiday use '~', industrial uses 'q') ----
    const seaChar = (areaKey==="industrial") ? "q" : "~";
    const isSeaArea = (areaKey==="town"||areaKey==="holiday"||areaKey==="industrial");
    if(isSeaArea && !insideKey && target===seaChar){
      if(season==="winter"){ banner(t("sea_winter")); return false; }   // no swimming in winter
      // past the buoy line (south): block going further south, but always allow swimming back north toward the beach
      if(nty>SWIM_BOTTOM && nty>=player.ty){ banner(t("buoy_msg")); return false; }
      // enter water: contextual message on first entry
      if(!player.swimming){ player.swimming=true; if(player.scooter){ player.scooter=false; SFX.scooterStop(); } banner(t(areaKey==="industrial"?"sea_polluted":("sea_"+season))); }
      player.tx=ntx; player.ty=nty; SFX.step(); return true;
    }
    // moving onto land
    if(isSolid(ntx,nty)) return false;
    if(player.swimming){ player.swimming=false; }   // climb out of the water
    player.tx=ntx; player.ty=nty; SFX.step(); return true;
  }

  function updateAnimals(dt){
    for(const a of animals){
      const wd=a.wander; const target=wd.pts[(wd.i+1)%wd.pts.length];
      const tX=target[0]*TILE, tY=target[1]*TILE, sp=wd.speed*dt;
      let dx=tX-a.px, dy=tY-a.py;
      if(Math.abs(dx)<=sp && Math.abs(dy)<=sp){ a.px=tX; a.py=tY; wd.i=(wd.i+1)%wd.pts.length; }
      else {
        let nx=Math.round(a.px/TILE), ny=Math.round(a.py/TILE);
        if(Math.abs(dx)>Math.abs(dy)){ nx+=Math.sign(dx); a.dir=dx>0?"right":"left"; }
        else { ny+=Math.sign(dy); a.dir=dy>0?"down":"up"; }
        if(isSolid(nx,ny)){ a.px=Math.round(a.px/TILE)*TILE; a.py=Math.round(a.py/TILE)*TILE; wd.i=(wd.i+1)%wd.pts.length; }
        else if(Math.abs(dx)>Math.abs(dy)) a.px+=Math.sign(dx)*sp;
        else a.py+=Math.sign(dy)*sp;
      }
      a.animT+=dt;
    }
  }

  function routineDest(n){
    const h=clock*24;
    if(n.routine){ for(const seg of n.routine){ if(h>=seg.h[0] && h<seg.h[1]) return seg.go; } }
    return n.home || [Math.round(n.px/TILE),Math.round(n.py/TILE)];
  }
  function npcTileFree(n,tx,ty){
    if(isSolid(tx,ty)) return false;
    // NPCs may pass through each other (soft) to avoid deadlocks; only avoid standing on the player.
    if(Math.round(player.px/TILE)===tx && Math.round(player.py/TILE)===ty) return false;
    return true;
  }
  // BFS path from (sx,sy) to (dx,dy) over walkable tiles (ignores dynamic NPC blocking for the plan;
  // dynamic avoidance happens per-step). Returns array of [tx,ty] steps or null.
  function bfsPath(sx,sy,dx,dy){
    if(sx===dx&&sy===dy) return [];
    const key=(x,y)=>x+","+y;
    const prev={}; const seen=new Set([key(sx,sy)]); const q=[[sx,sy]];
    let head=0, found=false;
    while(head<q.length){
      const [x,y]=q[head++];
      for(const [ox,oy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+ox, ny=y+oy, k=key(nx,ny);
        if(seen.has(k)) continue;
        if(isSolid(nx,ny)) continue;
        seen.add(k); prev[k]=[x,y];
        if(nx===dx&&ny===dy){ found=true; q.length=0; break; }
        q.push([nx,ny]);
      }
      if(found) break;
    }
    if(!found) return null;
    const path=[]; let cur=[dx,dy];
    while(!(cur[0]===sx&&cur[1]===sy)){ path.push(cur); const p=prev[key(cur[0],cur[1])]; if(!p) return null; cur=p; }
    path.reverse(); return path;
  }
  function updateNpcs(dt){
    for(const n of currentNpcs()){
      if(n.fishing){ n.animT=(n.animT||0)+dt; continue; }
      if(!n.routine && !n.home) continue;
      const sp=(n.speed||22)*dt;
      const cx=Math.round(n.px/TILE), cy=Math.round(n.py/TILE);
      const dest=routineDest(n);
      const atTile=(Math.abs(n.px-cx*TILE)<0.6 && Math.abs(n.py-cy*TILE)<0.6);

      // If we still have a pixel target we haven't reached, keep gliding toward it.
      if(n.tgt && !(Math.abs(n.px-n.tgt[0]*TILE)<0.6 && Math.abs(n.py-n.tgt[1]*TILE)<0.6)){
        const tX=n.tgt[0]*TILE, tY=n.tgt[1]*TILE;
        if(n.px<tX) n.px=Math.min(tX,n.px+sp); else if(n.px>tX) n.px=Math.max(tX,n.px-sp);
        if(n.py<tY) n.py=Math.min(tY,n.py+sp); else if(n.py>tY) n.py=Math.max(tY,n.py-sp);
        n.moving=true; n.animT=(n.animT||0)+dt;
        continue;   // don't re-decide mid-tile -> no jitter
      }

      // Aligned on a tile: snap and decide the next step.
      n.px=cx*TILE; n.py=cy*TILE; n.tgt=null;
      n.replan=(n.replan||0)-dt;
      if(cx===dest[0] && cy===dest[1]){ n.moving=false; n.path=null; continue; }   // arrived: idle (frozen)
      if(!n.path || n.path.length===0 || n.destKey!==dest[0]+","+dest[1] || n.replan<=0){
        n.path=bfsPath(cx,cy,dest[0],dest[1]); n.destKey=dest[0]+","+dest[1]; n.replan=2.0;
      }
      if(n.path && n.path.length){
        const [nx,ny]=n.path[0];
        if(npcTileFree(n,nx,ny)){ n.tgt=[nx,ny]; n.path.shift(); n.moving=true;
          n.dir=(nx>cx)?"right":(nx<cx)?"left":(ny>cy?"down":"up");
          const tX=n.tgt[0]*TILE, tY=n.tgt[1]*TILE;
          if(n.px<tX) n.px=Math.min(tX,n.px+sp); else if(n.px>tX) n.px=Math.max(tX,n.px-sp);
          if(n.py<tY) n.py=Math.min(tY,n.py+sp); else if(n.py>tY) n.py=Math.max(tY,n.py-sp);
          n.animT=(n.animT||0)+dt;
        } else { n.moving=false; n.replan=0.5; }   // blocked (usually the player): wait, no jitter
      } else { n.moving=false; }
    }
  }

  function updateCamera(){
    const worldW=cur.w*TILE, worldH=cur.h*TILE;
    cam.x=Math.round(player.px+TILE/2-W/2); cam.y=Math.round(player.py+TILE/2-H/2);
    if(worldW<=W) cam.x=Math.round((worldW-W)/2); else cam.x=Math.max(0,Math.min(worldW-W,cam.x));
    if(worldH<=H) cam.y=Math.round((worldH-H)/2); else cam.y=Math.max(0,Math.min(worldH-H,cam.y));
  }

  // ---- WORLD RENDER ----
  function drawWorld(){
    const p=pal();
    ctx.fillStyle=p.grass; ctx.fillRect(0,0,W,H);
    const t0x=Math.floor(cam.x/TILE)-2, t0y=Math.floor(cam.y/TILE)-3;
    const t1x=Math.ceil((cam.x+W)/TILE)+2, t1y=Math.ceil((cam.y+H)/TILE)+2;
    // ground + shadow passes (always under everything)
    for(let ty=t0y;ty<=t1y;ty++) for(let tx=t0x;tx<=t1x;tx++) drawGround(tileAt(tx,ty),tx*TILE-cam.x,ty*TILE-cam.y,tx,ty,p);
    for(let ty=t0y;ty<=t1y;ty++) for(let tx=t0x;tx<=t1x;tx++) drawTileShadow(tileAt(tx,ty),tx*TILE-cam.x,ty*TILE-cam.y);

    // Collect movable entities with their tile-row for depth sorting.
    const ents=[];
    const push=(ty,fn)=> ents.push({ty,fn});
    if(inTown()){
      if(questState>=1 && !cat.found) push(cat.ty, ()=>drawCat(cat.tx*TILE-cam.x, cat.ty*TILE-cam.y, cat.animT));
      if(shellQuest>=1 && !shell.found) push(shell.ty, ()=>drawShell(shell.tx*TILE-cam.x, shell.ty*TILE-cam.y, shell.animT));
      if(QUESTS.kids.status==="active" && QUESTS.kids.step>=1 && !ball.taken) push(ball.ty, ()=>drawBall(ball.tx*TILE-cam.x, ball.ty*TILE-cam.y));
      if(QUESTS.oldfriend.status==="active" && !keyring.taken) push(keyring.ty, ()=>drawKeyring(keyring.tx*TILE-cam.x, keyring.ty*TILE-cam.y));
      photos.forEach(ph=>{ if(!ph.taken && (QUESTS.photos.status==="active"||QUESTS.photos.status==="available")) push(ph.ty, ()=>drawPhoto(ph.tx*TILE-cam.x, ph.ty*TILE-cam.y)); });
      animals.forEach(a=> push(Math.round(a.py/TILE), ()=>drawAnimal(a, a.px-cam.x, a.py-cam.y)));
    }
    // ambient fauna (all areas): ground critters depth-sorted; flyers/jumpers drawn on top later
    if(!insideKey) fauna.forEach(a=>{ if(a.mode==="wander") push(Math.round(a.py/TILE), ()=>drawFaunaCritter(a, a.px-cam.x, a.py-cam.y)); });
    if(typeof currentClues==="function"){ currentClues().forEach(({c})=> push(c.ty, ()=>drawClue(c.tx*TILE-cam.x, c.ty*TILE-cam.y))); }
    if(tail.active && tail.target){ push(Math.round(tail.target.py/TILE), ()=>drawTail()); }
    if(chase.active && chase.target){ push(Math.round(chase.target.py/TILE), ()=>drawChase()); }
    currentNpcs().forEach(n=> push(Math.round(n.py/TILE), ()=>drawNpc(n, n.px-cam.x, n.py-cam.y)));
    if(areaKey==="mountain" && season==="winter") skiers.forEach(s=> push(Math.round(s.y/TILE), ()=>drawSkier(s)));
    push(Math.round(player.py/TILE), ()=>drawPlayer(player.px-cam.x, player.py-cam.y, player.dir, player.animT));
    // Bucket entities by row for interlacing with object rows.
    const byRow={}; ents.forEach(e=>{ (byRow[e.ty]=byRow[e.ty]||[]).push(e.fn); });

    // Interlaced pass: for each row (top->bottom) draw that row's object tiles, then the entities standing on that row.
    for(let ty=t0y;ty<=t1y;ty++){
      for(let tx=t0x;tx<=t1x;tx++) drawObject(tileAt(tx,ty),tx*TILE-cam.x,ty*TILE-cam.y,tx,ty,p);
      if(byRow[ty]) byRow[ty].forEach(fn=>fn());
    }

    if(inTown()){
      decor.forEach(d=> drawDecor(d, d.tx*TILE-cam.x, d.ty*TILE-cam.y));
      streetLamps.forEach(L=> drawLamp(L[0]*TILE-cam.x, L[1]*TILE-cam.y));
      drawShip(ship.tx*TILE-cam.x, ship.ty*TILE-cam.y);
    }
    if(areaKey==="industrial"){ drawRaft(raft.tx*TILE-cam.x, raft.ty*TILE-cam.y); }
    if(!insideKey) fauna.forEach(a=>{ if(a.mode==="fly"||a.mode==="jump") drawFaunaCritter(a, a.px-cam.x, a.py-cam.y); });
    if(areaKey==="cape"){ drawLighthouse(2*TILE-cam.x, 30*TILE-cam.y); }   // lighthouse on the cape's south tip, by the rocks
    if(areaKey==="holiday"){
      if(holidayBeachOn()){
        holidayBeachProps.forEach(bp=> drawBeachProp(bp, bp.tx*TILE-cam.x, bp.ty*TILE-cam.y));
        holidaySwimmers.forEach(s=> drawSwimmer(s.x-cam.x, s.y-cam.y, s.animT, s.dir));
        beachGames.forEach(g=>{
          // two kids facing each other + the ball
          drawBeachKid(g.kids[0][0]*TILE-cam.x, g.kids[0][1]*TILE-cam.y, 1, g.kind);
          drawBeachKid(g.kids[1][0]*TILE-cam.x, g.kids[1][1]*TILE-cam.y, -1, g.kind);
          drawBeachBall(g.ball.x-cam.x, g.ball.y-cam.y);
        });
      }
      // (the lighthouse now stands on the south tip of the Cape, not here)
    }
    currentBuoys().forEach(b=>{
      if(b.lamp){ const nf=nightFactor(); if(nf>0.25){ const bx=b.tx*TILE-cam.x, by=b.ty*TILE-cam.y;
        ctx.fillStyle="rgba(255,224,150,"+(0.16*nf).toFixed(3)+")"; ctx.fillRect(bx-6,by-6,TILE+12,TILE+12);
        ctx.fillStyle="rgba(255,240,190,"+(0.9*nf).toFixed(3)+")"; ctx.fillRect(bx+6,by+2,4,3); } }
      drawBuoy(b.tx*TILE-cam.x, b.ty*TILE-cam.y, b.animT);
    });
    if(inTown()){
      if(season==="summer"){
        beachProps.forEach(bp=> drawBeachProp(bp, bp.tx*TILE-cam.x, bp.ty*TILE-cam.y));
        swimmers.forEach(s=> drawSwimmer(s.x-cam.x, s.y-cam.y, s.animT, s.dir));
      }
    }
    drawInteractHint();
  }
  function drawInteractHint(){
    if(dialog.active) return;
    const {fx,fy}=facingTile(); const n=npcAt(fx,fy); const fc=tileAt(fx,fy);
    const onCat=(!insideKey && questState>=1 && !cat.found && fx===cat.tx && fy===cat.ty);
    const onShell=(!insideKey && shellQuest>=1 && !shell.found && fx===shell.tx && fy===shell.ty);
    const onBall=(!insideKey && QUESTS.kids.status==="active" && QUESTS.kids.step>=1 && !ball.taken && fx===ball.tx && fy===ball.ty);
    const onKey=(!insideKey && QUESTS.oldfriend.status==="active" && !keyring.taken && fx===keyring.tx && fy===keyring.ty);
    const onPhoto=(!insideKey && (QUESTS.photos.status==="active"||QUESTS.photos.status==="available") && photos.some(ph=>!ph.taken && fx===ph.tx && fy===ph.ty));
    const onShip=(!insideKey && inTown() && Math.abs(fx-ship.tx)<=2 && Math.abs(fy-ship.ty)<=2);
    const onDoor=(!insideKey && ((inTown() && !!DOORS[fc]) || (!inTown() && /[1-9]/.test(fc) && AREA_INTERIOR[areaKey]))) || (insideKey && fc==="e");
    if(n||onCat||onShell||onBall||onKey||onPhoto||onShip||onDoor){ const bx=player.px-cam.x, by=player.py-cam.y; textOutlined("A",bx+6,by-8,"#fff","#000"); }
  }

  function drawGround(c,x,y,tx,ty,p){
    // base
    if(c==="~"||c==="w"||c==="o"){ // sea
      ctx.fillStyle=p.water; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle=p.waterDk; const w=(Math.floor(performance.now()/350)%2)*2;
      ctx.fillRect(x+2+w,y+5,6,1); ctx.fillRect(x+8-w,y+11,5,1);
      ctx.fillStyle="#ffffff28"; ctx.fillRect(x+3,y+3,3,1);
      return;
    }
    if(c==="g"){ // rocky cliff (in the sea): water base + grey rock with foam
      ctx.fillStyle=p.water; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle="#6a6e76"; ctx.fillRect(x+1,y+1,TILE-2,TILE-2);
      ctx.fillStyle="#565a62"; ctx.fillRect(x+2,y+9,TILE-4,4);
      ctx.fillStyle="#8a8e96"; ctx.fillRect(x+3,y+2,5,3); ctx.fillRect(x+9,y+4,4,3);
      ctx.fillStyle="#ffffff55"; ctx.fillRect(x+1,y+TILE-2,TILE-2,1);
      return;
    }
    if(c==="s"){ // beach sand
      ctx.fillStyle=p.sand; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle=p.sandDk; ctx.fillRect(x+3,y+6,2,1); ctx.fillRect(x+10,y+10,2,1); ctx.fillRect(x+7,y+3,1,1);
      return;
    }
    if(c==="m"){ // promenade (paved)
      ctx.fillStyle=p.pathEdge; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle=p.path; ctx.fillRect(x+1,y+1,TILE-2,TILE-2);
      ctx.fillStyle="#00000018"; ctx.fillRect(x,y,TILE,1); ctx.fillRect(x+8,y,1,TILE);
      return;
    }
    if(c==="x"){ // plaza paving (light stone tiles)
      ctx.fillStyle="#c8c4b8"; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle="#b4b0a4"; ctx.fillRect(x,y,TILE,1); ctx.fillRect(x,y,1,TILE); ctx.fillRect(x+8,y,1,TILE); ctx.fillRect(x,y+8,TILE,1);
      if(season==="winter"){ ctx.fillStyle="#dbe2ea"; ctx.fillRect(x,y,TILE,TILE); ctx.fillStyle="#c2ccd6"; ctx.fillRect(x,y+8,TILE,1); }
      return; }
    if(c==="="){ ctx.fillStyle=p.road; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle=p.roadEdge; for(let i=0;i<2;i++)for(let j=0;j<2;j++){ ctx.fillRect(x+2+i*7+((j)%2?1:0),y+2+j*7,5,5); }
      ctx.fillStyle="rgba(255,255,255,0.10)"; ctx.fillRect(x,y+7,TILE,1);   // faint centre line
      ctx.fillStyle="#00000022"; ctx.fillRect(x,y,TILE,1); ctx.fillRect(x,y,1,TILE); return; }
    if(c==="g"){ ctx.fillStyle="#4c8a3a"; ctx.fillRect(x,y,TILE,TILE); ctx.fillStyle="#5a9a44"; ctx.fillRect(x+3,y+3,3,2); ctx.fillRect(x+9,y+8,3,2);
      if(season==="autumn"){ctx.fillStyle="#9a8a3a";ctx.fillRect(x,y,TILE,TILE);} if(season==="winter"){ctx.fillStyle="#cad2da";ctx.fillRect(x,y,TILE,TILE);}
      return; }
    if(c==="P"){ // football pitch: green with mowing stripes + white lines
      ctx.fillStyle=(tx%2===0)?"#3f8a34":"#489a3c"; ctx.fillRect(x,y,TILE,TILE);
      if(season==="autumn"){ctx.fillStyle=(tx%2===0)?"#8a8a34":"#9a9a3c";ctx.fillRect(x,y,TILE,TILE);}
      if(season==="winter"){ctx.fillStyle="#d4dce4";ctx.fillRect(x,y,TILE,TILE);}
      ctx.fillStyle="#ffffff40"; ctx.fillRect(x,y,TILE,1);
      return; }
    if(c==="|"){ ctx.fillStyle="#3f8a34"; ctx.fillRect(x,y,TILE,TILE); ctx.fillStyle="#f0f0f0"; ctx.fillRect(x+6,y+2,1,12); ctx.fillRect(x+6,y+2,4,1); return; }
    if(c==="^"){ // mountain rock / peak (solid)
      ctx.fillStyle="#8a8a92"; ctx.fillRect(x,y,TILE,TILE); ctx.fillStyle="#9aa0a8"; ctx.fillRect(x,y,TILE,4);
      ctx.fillStyle="#6a6a74"; ctx.fillRect(x+2,y+8,4,3); ctx.fillRect(x+9,y+5,3,4);
      if(season==="winter"){ ctx.fillStyle="#eef4fa"; ctx.fillRect(x,y,TILE,5); ctx.fillRect(x+2,y+6,3,2); } // snow cap
      return; }
    if(c==="/"){ // mountain trail (walkable)
      ctx.fillStyle=(season==="winter")?"#c8cdd4":"#b39a6a"; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle=(season==="winter")?"#b4bcc6":"#997e50"; ctx.fillRect(x+3,y+5,3,2); ctx.fillRect(x+9,y+9,3,2);
      return; }
    if(c==="l"){ // fresh lake (solid)
      ctx.fillStyle="#3f78c0"; ctx.fillRect(x,y,TILE,TILE); ctx.fillStyle="#356aad"; const w=(Math.floor(performance.now()/400)%2)*2;
      ctx.fillRect(x+2+w,y+5,6,1); ctx.fillRect(x+8-w,y+11,5,1); ctx.fillStyle="#ffffff30"; ctx.fillRect(x+3,y+3,3,1);
      if(season==="winter"){ ctx.fillStyle="#d6e4ee"; ctx.fillRect(x,y,TILE,TILE); ctx.fillStyle="#bcd0de"; ctx.fillRect(x+3,y+6,6,1); }
      return; }
    if(c==="q"){ // polluted sea (industrial): deep dark-blue + sparse grey scum patches
      ctx.fillStyle="#1c3450"; ctx.fillRect(x,y,TILE,TILE);                 // deep dark blue base
      ctx.fillStyle="#16283e"; const w=(Math.floor(performance.now()/400)%2)*2;
      ctx.fillRect(x+2+w,y+5,6,1); ctx.fillRect(x+8-w,y+11,5,1);            // dark ripples
      // sparse greasy grey scum blotches (deterministic per tile so they don't flicker)
      const h=((x*31+y*17)>>>0);
      if(h%11===0){ ctx.fillStyle="#6a6e70"; ctx.fillRect(x+4,y+4,4,2); }
      if(h%17===0){ ctx.fillStyle="#7e8284"; ctx.fillRect(x+9,y+9,3,2); }
      return; }
    if(c==="Y"){ // concrete pavement
      ctx.fillStyle="#9a9a9e"; ctx.fillRect(x,y,TILE,TILE); ctx.fillStyle="#8a8a8e"; ctx.fillRect(x,y+7,TILE,1); ctx.fillRect(x+7,y,1,TILE);
      ctx.fillStyle="#00000010"; ctx.fillRect(x,y,TILE,1); return; }
    if(c==="d"){ // wooden boardwalk/deck
      ctx.fillStyle="#b98a52"; ctx.fillRect(x,y,TILE,TILE); ctx.fillStyle="#9a6f3e"; for(let i=0;i<TILE;i+=4) ctx.fillRect(x,y+i,TILE,1); return; }
    if(c==="M"){ // recognizable mountain PEAK (rock + snow cap)
      ctx.fillStyle="#7a7a84"; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle="#9aa0a8"; ctx.fillRect(x+2,y+4,12,10);
      ctx.fillStyle="#eef4fa"; ctx.fillRect(x+5,y+2,6,5); ctx.fillRect(x+4,y+6,3,2); ctx.fillRect(x+9,y+6,3,2); // snow cap
      ctx.fillStyle="#6a6a74"; ctx.fillRect(x+3,y+11,3,3); ctx.fillRect(x+9,y+10,3,4); return; }
    // grass base + more tonal variation (patches) for contrast
    ctx.fillStyle=((tx+ty)%2===0)?p.grass:p.grassAlt; ctx.fillRect(x,y,TILE,TILE);
    const v=vary(tx,ty);
    if(v>0){ ctx.fillStyle=tint(p.grass,14); ctx.fillRect(x,y,TILE,TILE); }
    else if(v<0){ ctx.fillStyle=tint(p.grassAlt,-14); ctx.fillRect(x,y,TILE,TILE); }
    if(season==="winter"){ ctx.fillStyle="#eef4fa"; ctx.fillRect(x+2,y+3,2,2); ctx.fillRect(x+10,y+8,2,2); ctx.fillStyle="#dfe8f2"; ctx.fillRect(x+6,y+11,2,1); }
    else { ctx.fillStyle=tint(p.grassAlt,-10); ctx.fillRect(x+4,y+11,3,1); ctx.fillRect(x+11,y+6,2,1); ctx.fillStyle=tint(p.grass,20); ctx.fillRect(x+7,y+4,2,1); }
  }

    K:{roof:"#3a4652",roofDk:"#232c34",wall:"#8a6a3a",wallDk:"#5e4724",label:"OFF",lab:"#e0c040"}       // workshop/officina
  };
  const BLD_LETTERS=new Set(["A","B","M","Y","O","Z","E","+","U","F","K"]);
  function sameBld(c){ return c; }
  function drawBuilding(c,x,y,tx,ty){
    const th=BLD[c]; if(!th) return;
    const above=tileAt(tx,ty-1);
    const isTop = (above!==c);            // topmost row of this building column -> draw roof
    if(isTop){
      // tall roof rising above the tile
      const top=y-8;
      ctx.fillStyle=tint(th.roof,26); ctx.fillRect(x-1,top,TILE+2,6);
      ctx.fillStyle=tint(th.roof,52); ctx.fillRect(x-1,top,TILE+2,1);
      ctx.fillStyle=th.roof;   ctx.fillRect(x-1,top+6,TILE+2,6);
      ctx.fillStyle=th.roofDk; ctx.fillRect(x-1,top+12,TILE+2,4);
      ctx.fillStyle="rgba(0,0,0,0.10)"; for(let i=2;i<TILE;i+=4) ctx.fillRect(x+i,top+2,1,14);
      ctx.fillStyle=tint(th.roofDk,-20); ctx.fillRect(x-2,y+13,TILE+4,3);
      ctx.fillStyle="rgba(0,0,0,0.30)"; ctx.fillRect(x-1,y+16,TILE+2,1);
      // label on the roof band (only near the horizontal center of the building)
      const leftSame=tileAt(tx-1,ty)===c, rightSame=tileAt(tx+1,ty)===c;
      if(th.label && !leftSame && rightSame){ ctx.font="6px monospace"; ctx.fillStyle=th.lab; ctx.fillText(th.label, x+2, top+4); }
      if(season==="winter"){ ctx.fillStyle="#eef4fa"; ctx.fillRect(x-1,top,TILE+2,3); }
    } else {
      // facade
      const wall=th.wall, wallDk=th.wallDk;
      ctx.fillStyle=tint(wall,16); ctx.fillRect(x,y,TILE,5);
      ctx.fillStyle=wall;          ctx.fillRect(x,y+5,TILE,6);
      ctx.fillStyle=tint(wall,-14);ctx.fillRect(x,y+11,TILE,5);
      ctx.fillStyle="rgba(0,0,0,0.22)"; ctx.fillRect(x,y+14,TILE,2);
      ctx.fillStyle=tint(wall,24); ctx.fillRect(x,y,1,TILE-2);
      ctx.fillStyle="rgba(0,0,0,0.18)"; ctx.fillRect(x+TILE-2,y,2,TILE-1);
      // windows (rows of lit panes; skip for abandoned factory which has broken ones)
      if(c==="F"){ ctx.fillStyle="#2a2822"; ctx.fillRect(x+3,y+4,4,4); ctx.fillRect(x+9,y+5,3,3); ctx.fillStyle="#15140f"; ctx.fillRect(x+4,y+5,1,2); }
      else { const lit = nightFactor()>0.4; ctx.fillStyle= lit?"#ffde7a":"#3a6a90"; ctx.fillRect(x+3,y+5,4,4); ctx.fillRect(x+9,y+5,4,4);
        ctx.fillStyle= lit?"#fff2c0":"#cfeaff"; ctx.fillRect(x+3,y+5,2,2); ctx.fillRect(x+9,y+5,2,2); }
    }
  }

  function drawObject(c,x,y,tx,ty,p){
    switch(c){
      case "T": drawTree(x,y,p); break;
      case "b": drawBush(x,y,p); break;
      case "'": drawFlower(x,y,p); break;
      case ",": ctx.fillStyle=p.grassAlt; ctx.fillRect(x+6,y+9,2,4); ctx.fillRect(x+9,y+7,2,5); break;
      case "R": drawHouseRoof(x,y,p); break;
      case "C": drawHouseRoof(x,y,p);
                ctx.fillStyle="#7a3a2a"; ctx.fillRect(x+9,y-13,4,9);
                ctx.fillStyle="#5a2820"; ctx.fillRect(x+12,y-13,1,9);
                ctx.fillStyle="#9a4a36"; ctx.fillRect(x+9,y-13,1,9);
                ctx.fillStyle="#3a1c16"; ctx.fillRect(x+9,y-11,4,1); ctx.fillRect(x+9,y-8,4,1);
                ctx.fillStyle="#c8c8d0"; ctx.fillRect(x+8,y-14,6,2);
                if(!insideKey && Math.floor(performance.now()/400)%2===0){ ctx.fillStyle="#cfcfcf"; ctx.fillRect(x+10,y-18,2,3); ctx.fillRect(x+11,y-21,2,2); }
                break;
      case "H": drawHouseWall(x,y,p,false); break;
      case "W": drawHouseWall(x,y,p,true); break;
      case "S": drawShopRoof(x,y,p); break;
      case "A": drawCivicRoof(x,y,p); break;
      case "B": drawCivicWall(x,y,p,false); break;
      case "V": drawCivicWall(x,y,p,true); break;
      case "D": drawHouseWall(x,y,p,false); drawDoor(x,y,false); break;
      case "1": case "2": case "3": case "4": case "5": case "6": case "7": case "8": case "9":
                (c==="4")?drawCivicWall(x,y,p,false):drawHouseWall(x,y,p,false); drawDoor(x,y, !!DOORS[c] || !inTown()); break;
      case "L": drawLamp(x,y); break;
      case "N": drawBench(x,y); break;
      case "P": drawSign(x,y); break;
      case "Q": drawWell(x,y,p); break;
      case "K": drawCrane(x,y); break;
      case "w": drawPier(x,y); break;
      case "o": drawBoatTile(x,y,p); break;
      case "G": drawWarehouseWall(x,y); break;
      case "J": drawWarehouseRoof(x,y); break;
      case "c": drawCrate(x,y); break;
      case "F": ctx.fillStyle="#6a6560"; ctx.fillRect(x,y,TILE,TILE); ctx.fillStyle="#7a756e"; ctx.fillRect(x,y,TILE,3);
                ctx.fillStyle="#00000022"; ctx.fillRect(x,y+TILE-2,TILE,2); ctx.fillStyle="#4a4640"; ctx.fillRect(x+3,y+5,3,4); ctx.fillRect(x+9,y+6,3,3); break; // factory wall
      case "k": // smokestack rising above the roof, DENSE smoke
                ctx.fillStyle="#5a504a"; ctx.fillRect(x+9,y-14,4,16); ctx.fillStyle="#3a332e"; ctx.fillRect(x+12,y-14,1,16);
                ctx.fillStyle="#c04030"; ctx.fillRect(x+9,y-6,4,2);
                if(!insideKey){ const ph=(performance.now()/220|0)%3;
                  ctx.fillStyle="rgba(70,70,76,0.85)"; ctx.fillRect(x+9,y-18,4,4);
                  ctx.fillStyle="rgba(90,90,96,0.7)"; ctx.fillRect(x+8-ph,y-23,6,5);
                  ctx.fillStyle="rgba(110,110,118,0.5)"; ctx.fillRect(x+6+ph,y-29,8,6);
                  ctx.fillStyle="rgba(130,130,140,0.32)"; ctx.fillRect(x+4,y-35,12,7); } break;
      case "e": // power pole
                ctx.fillStyle="#5a4a38"; ctx.fillRect(x+7,y+2,2,13); ctx.fillStyle="#3a2e20"; ctx.fillRect(x+3,y+3,10,1); ctx.fillRect(x+3,y+6,10,1);
                ctx.fillStyle="#222"; ctx.fillRect(x+3,y+3,1,4); ctx.fillRect(x+12,y+3,1,4); break;
      case "z": // fatiscent building
                ctx.fillStyle="#8a8078"; ctx.fillRect(x,y,TILE,TILE); ctx.fillStyle="#6a625a"; ctx.fillRect(x,y+TILE-3,TILE,3);
                ctx.fillStyle="#3a352f"; ctx.fillRect(x+4,y+4,4,5); ctx.fillRect(x+9,y+7,3,4); ctx.fillStyle="#2a2622"; ctx.fillRect(x+5,y+9,2,3); break; // broken windows
      case "p": // palm tree
                ctx.fillStyle=p.trunk||"#8a5a2a"; ctx.fillRect(x+7,y+7,2,8);
                ctx.fillStyle="#2c7a3c"; ctx.fillRect(x+3,y+3,10,2); ctx.fillRect(x+5,y+1,6,2); ctx.fillRect(x+2,y+5,4,2); ctx.fillRect(x+10,y+5,4,2);
                ctx.fillStyle="#3f9a4c"; ctx.fillRect(x+6,y+2,4,2); if(season==="winter"){ctx.fillStyle="#dfeaf4";ctx.fillRect(x+5,y+1,4,1);} break;
      case "u": // beach umbrella
                ctx.fillStyle="#7a5a2a"; ctx.fillRect(x+7,y+7,1,8); ctx.fillStyle="#e04040"; ctx.fillRect(x+2,y+3,12,3);
                ctx.fillStyle="#f0f0f0"; ctx.fillRect(x+2,y+3,3,3); ctx.fillRect(x+8,y+3,3,3); break;
      case "v": // bubbling chemical tank/canister
                ctx.fillStyle="#0a0a12"; ctx.fillRect(x+3,y+3,10,12);
                ctx.fillStyle="#5a6a4a"; ctx.fillRect(x+4,y+4,8,10); ctx.fillStyle="#48583a"; ctx.fillRect(x+4,y+4,8,2);
                ctx.fillStyle="#c8d000"; ctx.fillRect(x+5,y+6,6,2);  // hazard band
                { const b=(performance.now()/200|0)%3; ctx.fillStyle="#9ad04a"; ctx.fillRect(x+6,y+3-b,2,2); ctx.fillStyle="#c8f070"; ctx.fillRect(x+8,y+2-((b+1)%3),1,1); } // bubbles
                break;
      case "i": // metal chain-link fence
                ctx.fillStyle="#8a8e94"; ctx.fillRect(x+1,y,1,TILE); ctx.fillRect(x+13,y,1,TILE);  // posts
                ctx.strokeStyle="#a8acb2"; ctx.lineWidth=1;
                ctx.beginPath(); for(let i=2;i<14;i+=3){ ctx.moveTo(x+i,y+1); ctx.lineTo(x+i+3,y+TILE-1); ctx.moveTo(x+i+3,y+1); ctx.lineTo(x+i,y+TILE-1);} ctx.stroke();
                ctx.fillStyle="#6a6e74"; ctx.fillRect(x,y+2,TILE,1); ctx.fillRect(x,y+TILE-3,TILE,1); break;
      case "I": drawBigTree(x,y,p); break;
      case "O": // luxury pool water
                ctx.fillStyle="#40b0d8"; ctx.fillRect(x,y,TILE,TILE); ctx.fillStyle="#5ac0e8"; ctx.fillRect(x+1,y+1,TILE-2,TILE-2);
                ctx.fillStyle="#bfeaf8"; ctx.fillRect(x+2,y+2,4,1); ctx.fillRect(x+8,y+9,4,1); ctx.fillStyle="#2a8ab0"; ctx.fillRect(x,y,TILE,1); break;
      case "Z": drawChaletWall(x,y); break;
      case "X": drawChaletRoof(x,y); break;
      case "h": // rustic wood cabin wall
                ctx.fillStyle="#6a4a2a"; ctx.fillRect(x,y,TILE,TILE); ctx.fillStyle="#7a5836"; for(let i=0;i<TILE;i+=3) ctx.fillRect(x,y+i,TILE,1);
                ctx.fillStyle="#2a1c10"; ctx.fillRect(x+4,y+4,4,5); ctx.fillStyle="#3a2a1a"; ctx.fillRect(x,y+TILE-2,TILE,2); break;
    }
  }

  // ---- tile sprites ----
  function drawTree(x,y,p){
    // trunk
    ctx.fillStyle=p.trunk; ctx.fillRect(x+6,y+11,4,5); ctx.fillStyle="#3a2a18"; ctx.fillRect(x+9,y+11,1,5);
    ctx.fillStyle=tint(p.trunk,20); ctx.fillRect(x+6,y+11,1,5);
    // BIG rounded canopy rising above the tile (top at y-6)
    const top=y-6;
    ctx.fillStyle=p.treeDk;
    ctx.fillRect(x+3,top+2,10,12); ctx.fillRect(x+1,top+5,14,7); ctx.fillRect(x+5,top,6,3); ctx.fillRect(x+2,top+3,12,2);
    ctx.fillStyle=p.tree;
    ctx.fillRect(x+3,top+3,9,9); ctx.fillRect(x+4,top+1,7,3); ctx.fillRect(x+2,top+6,11,4);
    // volume: bright upper-left + shaded lower-right
    ctx.fillStyle=tint(p.tree,30); ctx.fillRect(x+3,top+2,5,4); ctx.fillRect(x+4,top+1,3,2);
    ctx.fillStyle=tint(p.treeDk,-14); ctx.fillRect(x+9,top+8,5,5);
    // leaf clumps by season
    if(season==="autumn"){ ctx.fillStyle="#e0a030"; ctx.fillRect(x+5,top+3,2,2); ctx.fillStyle="#f0c040"; ctx.fillRect(x+9,top+6,2,2); }
    else if(season==="winter"){ ctx.fillStyle="#eef4fa"; ctx.fillRect(x+3,top+1,6,2); ctx.fillRect(x+9,top+3,3,2); }
    else { ctx.fillStyle=tint(p.tree,44); ctx.fillRect(x+5,top+3,2,2); }
  }
  // BIG tall tree (pine-ish) for forests/mountain — rises high above the tile
  function drawBigTree(x,y,p){
    ctx.fillStyle=p.trunk||"#6a4a2a"; ctx.fillRect(x+7,y+9,2,7);
    const dk=p.treeDk||"#2c5a1c", md=p.tree||"#3f7a2c";
    // tall conical foliage stacked upward (top ~ y-16)
    ctx.fillStyle=dk;
    ctx.fillRect(x+2,y+2,12,9); ctx.fillRect(x+3,y-4,10,8); ctx.fillRect(x+5,y-10,6,8); ctx.fillRect(x+6,y-16,4,8);
    ctx.fillStyle=md;
    ctx.fillRect(x+3,y+2,9,7); ctx.fillRect(x+4,y-4,7,6); ctx.fillRect(x+6,y-10,3,6); ctx.fillRect(x+7,y-16,2,6);
    ctx.fillStyle=tint(md,30); ctx.fillRect(x+4,y-3,3,3); ctx.fillRect(x+6,y-9,2,3);   // NW highlight
    if(season==="winter"){ ctx.fillStyle="#eef4fa"; ctx.fillRect(x+6,y-16,3,2); ctx.fillRect(x+4,y-4,3,2); ctx.fillRect(x+3,y+2,4,2); }
    else if(season==="autumn"){ ctx.fillStyle="#c88028"; ctx.fillRect(x+8,y-6,2,2); ctx.fillRect(x+5,y+4,2,2); }
  }
  function drawChaletWall(x,y){ // dark timber alpine wall
    ctx.fillStyle="#6a4630"; ctx.fillRect(x,y,TILE,TILE); ctx.fillStyle="#7a5638"; for(let i=0;i<TILE;i+=3) ctx.fillRect(x,y+i,TILE,1);
    ctx.fillStyle="#00000028"; ctx.fillRect(x,y+TILE-2,TILE,2);
    ctx.fillStyle="#2a3a4a"; ctx.fillRect(x+4,y+4,8,6); ctx.fillStyle="#9ac0e0"; ctx.fillRect(x+5,y+5,6,4); ctx.fillStyle="#cfeaff"; ctx.fillRect(x+5,y+5,3,2); }
  function drawChaletRoof(x,y){ // steep snowy alpine roof rising above tile
    const top=y-8;
    ctx.fillStyle="#4a3428"; ctx.fillRect(x-1,top,TILE+2,7);
    ctx.fillStyle="#5a4030"; ctx.fillRect(x-1,top+7,TILE+2,7);
    ctx.fillStyle="#eef4fa"; ctx.fillRect(x-1,top,TILE+2,3); ctx.fillStyle="#dfe8f2"; ctx.fillRect(x-1,top+3,TILE+2,1); // snow
    ctx.fillStyle="#00000030"; ctx.fillRect(x-2,y+13,TILE+4,3); }
  function drawBush(x,y,p){ ctx.fillStyle="#00000030"; ctx.fillRect(x+2,y+6,12,9); ctx.fillStyle=p.treeDk; ctx.fillRect(x+3,y+6,10,8); ctx.fillStyle=p.tree; ctx.fillRect(x+4,y+6,8,5);
    const berry=season==="autumn"?"#e05028":(season==="winter"?"#dfeaf4":"#f050a0"); ctx.fillStyle=berry; ctx.fillRect(x+5,y+8,2,2); ctx.fillRect(x+9,y+9,2,2); }
  function drawFlower(x,y,p){ ctx.fillStyle="#3f7a2c"; ctx.fillRect(x+7,y+9,1,4); if(season==="winter"){ ctx.fillStyle="#dfeaf4"; ctx.fillRect(x+6,y+7,3,3); return; }
    ctx.fillStyle=p.flower; ctx.fillRect(x+6,y+6,3,3); ctx.fillRect(x+5,y+7,1,1); ctx.fillRect(x+9,y+7,1,1); ctx.fillStyle="#f5e050"; ctx.fillRect(x+7,y+7,1,1); }
  function drawHouseRoof(x,y,p){
    const tx=Math.round((x+cam.x)/TILE), ty=Math.round((y+cam.y)/TILE); const v=vary(tx,ty)*14;
    const roof=tint(p.roof,v), roofDk=tint(p.roofDk,v);
    // TALL pitched roof: rises ~8px ABOVE the tile, steep slopes, big overhang.
    const top=y-8;
    // back/upper slope (bright, catching NW light)
    ctx.fillStyle=tint(roof,34); ctx.fillRect(x-1, top, TILE+2, 8);
    // ridge highlight
    ctx.fillStyle=tint(roof,60); ctx.fillRect(x-1, top, TILE+2, 1);
    // front slope (mid -> shaded going down)
    ctx.fillStyle=roof;   ctx.fillRect(x-1, top+8, TILE+2, 6);
    ctx.fillStyle=roofDk; ctx.fillRect(x-1, top+14, TILE+2, 4);
    // shingle streaks
    ctx.fillStyle="rgba(0,0,0,0.10)"; for(let i=2;i<TILE;i+=4) ctx.fillRect(x+i, top+2, 1, 15);
    // overhanging eave + its cast shadow onto the facade below
    ctx.fillStyle=tint(roofDk,-24); ctx.fillRect(x-2, y+13, TILE+4, 3);
    ctx.fillStyle="rgba(0,0,0,0.30)"; ctx.fillRect(x-1, y+16, TILE+2, 1);
    if(season==="winter"){ ctx.fillStyle="#eef4fa"; ctx.fillRect(x-1, top, TILE+2, 4); ctx.fillStyle="#dfe8f2"; ctx.fillRect(x-1, top+4, TILE+2, 1); }
  }
  function drawHouseWall(x,y,p,window){
    const tx=Math.round((x+cam.x)/TILE), ty=Math.round((y+cam.y)/TILE); const v=vary(tx,ty)*12;
    const wall=tint(p.wall,v), wallDk=tint(p.wallDk,v);
    // Only rise above the tile if there's open space above (not a roof/wall of the same building).
    const above=tileAt(tx,ty-1);
    const buildingAbove = /[RCHWDABVSGJ1-9]/.test(above);
    const top = buildingAbove ? y : y-4;
    if(!buildingAbove){ ctx.fillStyle=tint(wall,-18); ctx.fillRect(x,top,TILE,3); } // eave shade only when exposed
    ctx.fillStyle=tint(wall,18);  ctx.fillRect(x,top+3,TILE,5);       // upper facade (lit)
    ctx.fillStyle=wall;           ctx.fillRect(x,top+8,TILE,6);
    ctx.fillStyle=tint(wall,-16); ctx.fillRect(x,top+14,TILE, (y+16)-(top+14) );  // lower facade to ground
    ctx.fillStyle="rgba(0,0,0,0.24)"; ctx.fillRect(x,y+14,TILE,2);    // ground contact
    ctx.fillStyle=tint(wall,26); ctx.fillRect(x,top+3,1,(y+14)-(top+3));
    ctx.fillStyle="rgba(0,0,0,0.20)"; ctx.fillRect(x+TILE-2,top+3,2,(y+14)-(top+3));
    if(window){
      const wy=top+6;
      ctx.fillStyle="#2a1c10"; ctx.fillRect(x+3,wy,10,8);
      ctx.fillStyle="#e8dcc0"; ctx.fillRect(x+3,wy+8,10,1);
      ctx.fillStyle="#3a6a90"; ctx.fillRect(x+4,wy+1,8,6);
      ctx.fillStyle="#cfeaff"; ctx.fillRect(x+4,wy+1,4,3);
      ctx.fillStyle="#26343f"; ctx.fillRect(x+7,wy+1,1,6); ctx.fillRect(x+4,wy+4,8,1);
      ctx.fillStyle="#5a3a1e"; ctx.fillRect(x+3,wy-1,10,1);
    }
  }
  function drawShopRoof(x,y,p){ // 3D striped awning with valance + hanging sign board
    const top=y-6;
    ctx.fillStyle="#00000025"; ctx.fillRect(x-1,y+11,TILE+2,2);          // shadow under awning
    ctx.fillStyle="#b0b0bc"; ctx.fillRect(x-1,top,TILE+2,3);             // awning top bar
    for(let i=0;i<TILE;i+=4){ ctx.fillStyle=(i/4)%2===0?"#e04a4a":"#f4f4f4"; ctx.fillRect(x+i,top+3,4,7); } // stripes
    // scalloped valance (little triangles at the bottom edge)
    for(let i=0;i<TILE;i+=4){ ctx.fillStyle=(i/4)%2===0?"#b83636":"#d8d8d8"; ctx.fillRect(x+i+1,top+10,2,2); }
    ctx.fillStyle="#00000030"; ctx.fillRect(x,top+10,TILE,1);
    ctx.fillStyle=p.wall; ctx.fillRect(x,y+12,TILE,4);                   // wall strip below
    // small hanging sign
    ctx.fillStyle="#6a4a2a"; ctx.fillRect(x+11,top-3,1,3); ctx.fillStyle="#8a6a3a"; ctx.fillRect(x+8,top-6,7,4);
    ctx.fillStyle="#e0c040"; ctx.fillRect(x+9,top-5,5,1); ctx.fillStyle="#3a2414"; ctx.fillRect(x+9,top-4,4,1); }
  function drawCivicRoof(x,y,p){ // grand tall roof with pediment + flag
    const top=y-10;
    ctx.fillStyle="#6a707c"; ctx.fillRect(x-1,top,TILE+2,6);             // upper roof
    ctx.fillStyle="#8a90a0"; ctx.fillRect(x-1,top+6,TILE+2,6);
    ctx.fillStyle="#a8aeba"; ctx.fillRect(x-1,top+2,TILE+2,1);           // highlight
    ctx.fillStyle="#00000030"; ctx.fillRect(x-1,top+12,TILE+2,2);       // eave shadow
    // golden finial + little flag
    ctx.fillStyle="#e0c040"; ctx.fillRect(x+7,top-4,2,4); ctx.fillStyle="#f0e070"; ctx.fillRect(x+7,top-5,2,2);
    ctx.fillStyle="#d84040"; ctx.fillRect(x+9,top-4,3,2); }
  function drawCivicWall(x,y,p,window){ ctx.fillStyle="#c0c2cc"; ctx.fillRect(x,y,TILE,TILE); ctx.fillStyle="#d6d8e2"; ctx.fillRect(x,y,TILE,TILE-2);
    // columns
    ctx.fillStyle="#a8aab6"; ctx.fillRect(x+2,y,2,TILE); ctx.fillRect(x+12,y,2,TILE);
    if(window){ ctx.fillStyle="#2c3a4a"; ctx.fillRect(x+5,y+2,6,12); ctx.fillStyle="#7ab0e0"; ctx.fillRect(x+6,y+3,4,10); ctx.fillStyle="#bfe0ff"; ctx.fillRect(x+6,y+3,2,4); } }
  function drawDoor(x,y,glow){
    ctx.fillStyle="rgba(0,0,0,0.30)"; ctx.fillRect(x+3,y+3,10,2);   // shadow under overhang above door
    ctx.fillStyle="#e0c8a0"; ctx.fillRect(x+3,y+4,10,12);          // light stone frame
    ctx.fillStyle="#2a180c"; ctx.fillRect(x+4,y+5,8,11);           // recess
    ctx.fillStyle="#6a4324"; ctx.fillRect(x+5,y+5,6,11);           // door
    ctx.fillStyle="#4a2c16"; ctx.fillRect(x+8,y+5,1,11);           // gap
    ctx.fillStyle="#8a5a30"; ctx.fillRect(x+5,y+5,2,11);           // lit door edge

  function drawPlayer(x,y,dir,animT){
    if(player.swimming){ drawSwimmingPlayer(x,y,dir,animT); return; }
    // Sober outfit: black shirt + jeans in all seasons; long grey coat + red wool beanie in winter.
    const pOutfit = (season==="winter") ? "pcoat" : "";
    const pOpt={skin:"#f0c890",hair:"#2a2018",shirt:"#1a1a1e",shirtDk:"#0e0e12",pants:"#2f4d78",outfit:pOutfit};
    if(fishing.active){ drawHuman(x, y, "left", false, 0, pOpt); drawRod(x,y,fishing.t*2,"left"); return; }
    if(player.boat){
      drawBoatV(x, y, dir, player.moving);
      drawHuman(x, y-4, dir, false, 0, pOpt);   // stands in the boat
      return;
    }
    if(player.scooter){
      // scooter under the rider: draw vespa first, then the seated rider (no walk bob)
      drawScooter(x, y, dir, player.moving);
      drawHuman(x, y-3, dir, false, 0, pOpt);   // rider sits slightly higher
      return;
    }
    const walking=player.moving, frame=Math.floor(animT*8)%2;
    const bob=(walking&&frame===0)?1:0;
    drawHuman(x, y-bob, dir, walking, frame, pOpt);
  }
  // Vespa-style scooter (red). dir sets orientation; headlight glows at night.
  function drawScooter(x,y,dir,moving){
    x=Math.round(x); y=Math.round(y);
    const night=(typeof nightFactor==="function")?nightFactor():0;
    const on = night>0.25;
    const red="#d83a34", redDk="#a82420", redHi="#f05a50", seat="#2a2a30", chrome="#c8ced6", tyre="#141418", hub="#9aa0a8";
    // ground shadow
    ctx.fillStyle="rgba(0,0,0,0.30)"; ctx.fillRect(x+1,y+15,14,2);
    if(dir==="left"||dir==="right"){
      const flip=(dir==="left");
      // work in a local frame then mirror if facing left
      // wheels (front to the "facing" side)
      const rearWX=3, frontWX=12;
      // tyres
      ctx.fillStyle=tyre; ctx.fillRect(x+rearWX-2,y+11,5,5); ctx.fillRect(x+frontWX-2,y+11,5,5);
      ctx.fillStyle=hub;  ctx.fillRect(x+rearWX-1,y+12,3,3); ctx.fillRect(x+frontWX-1,y+12,3,3);
      ctx.fillStyle="#3a3a40"; ctx.fillRect(x+rearWX,y+13,1,1); ctx.fillRect(x+frontWX,y+13,1,1);
      // rear body: big rounded Vespa belly (wider, tapering to the wheel)
      ctx.fillStyle=red;
      ctx.fillRect(x+1,y+8,8,5);      // main belly
      ctx.fillRect(x+2,y+6,7,2);      // top hump (rounded shoulder)
      ctx.fillRect(x+3,y+5,5,1);      // crown
      ctx.fillRect(x,y+9,1,3);        // bulge toward the rear wheel
      ctx.fillStyle=redDk; ctx.fillRect(x+1,y+11,8,2); ctx.fillRect(x,y+11,1,1);   // lower shade (roundness)
      ctx.fillStyle=redHi; ctx.fillRect(x+3,y+6,4,1); ctx.fillRect(x+2,y+8,3,1);   // highlight sheen
      // floorboard connecting belly to front
      ctx.fillStyle=redDk; ctx.fillRect(x+8,y+12,4,1);
      // front leg-shield (tall, rounded) toward the facing side
      ctx.fillStyle=red; ctx.fillRect(x+10,y+6,3,7); ctx.fillRect(x+11,y+5,2,1);
      ctx.fillStyle=redHi; ctx.fillRect(x+10,y+6,1,6);
      // seat sits on the rounded belly
      ctx.fillStyle=seat; ctx.fillRect(x+3,y+5,5,2);
      // handlebar riser + bar
      ctx.fillStyle="#2a2a34"; ctx.fillRect(x+11,y+3,2,3); ctx.fillRect(x+12,y+3,2,1);
      // round headlamp on the shield
      ctx.fillStyle=on?"#fff2b0":chrome; ctx.fillRect(x+12,y+7,2,2);
      // exhaust (rear low)
      ctx.fillStyle=chrome; ctx.fillRect(x,y+12,2,1);
      // beam + mirror for left
      if(flip){ /* mirror the whole thing horizontally */
        // easiest: overpaint mirrored not trivial; instead nudge headlamp to left side
      }
      if(on){ ctx.fillStyle="rgba(255,240,170,"+(0.22+0.4*night).toFixed(3)+")"; ctx.fillRect(x+ (flip?-12:14), y+4, 12, 8); }
    } else {
      // facing up/down: front/back view of a Vespa
      // wheel
      ctx.fillStyle=tyre; ctx.fillRect(x+6,y+13,4,3); ctx.fillStyle=hub; ctx.fillRect(x+7,y+14,2,1);
      // wide rounded leg-shield / front body (bombato)
      ctx.fillStyle=red; ctx.fillRect(x+3,y+6,10,7); ctx.fillRect(x+4,y+5,8,1); ctx.fillRect(x+2,y+8,1,4); ctx.fillRect(x+13,y+8,1,4);
      ctx.fillStyle=redDk; ctx.fillRect(x+3,y+11,10,2); ctx.fillRect(x+2,y+11,1,1); ctx.fillRect(x+13,y+11,1,1);
      ctx.fillStyle=redHi; ctx.fillRect(x+4,y+6,2,5);
      // seat (behind, small)
      ctx.fillStyle=seat; ctx.fillRect(x+5,y+4,6,2);
      // handlebars with grips
      ctx.fillStyle="#2a2a34"; ctx.fillRect(x+2,y+4,12,2);
      ctx.fillStyle="#101014"; ctx.fillRect(x+2,y+4,2,2); ctx.fillRect(x+12,y+4,2,2);
      if(dir==="down"){
        // round headlamp centred on the shield
        ctx.fillStyle=on?"#fff2b0":chrome; ctx.fillRect(x+7,y+8,2,3);
        if(on){ ctx.fillStyle="rgba(255,240,170,"+(0.22+0.4*night).toFixed(3)+")"; ctx.fillRect(x+2,y+14,12,10); }
      } else {
        ctx.fillStyle=on?"#ff6a5a":"#8a2020"; ctx.fillRect(x+6,y+6,4,1);  // tail light
      }
    }
    // exhaust puff while moving
    if(moving && Math.floor(performance.now()/120)%2===0){ ctx.fillStyle="rgba(190,190,190,0.5)"; ctx.fillRect(x+ (dir==="right"?0:(dir==="left"?14:12)), y+13, 2,2); }
  }

  // Motor boat the player pilots in the open sea; white hull, bigger; bow light glows at night.
  function drawBoatV(x,y,dir,moving){
    x=Math.round(x); y=Math.round(y);
    const night=(typeof nightFactor==="function")?nightFactor():0; const on=night>0.25;
    const white="#f0f2f6", shade="#c8ced8", stripe="#3a8ad0", dark="#0a0a12", trim="#e0e4ea";
    // wake (wider)
    ctx.fillStyle="rgba(255,255,255,0.4)"; ctx.fillRect(x-2,y+16,20,2);
    if(dir==="left"||dir==="right"){
      const bowRight=(dir==="right");
      // hull outline + white body (extends beyond the tile)
      ctx.fillStyle=dark; ctx.fillRect(x-3,y+7,22,9);
      ctx.fillStyle=white; ctx.fillRect(x-2,y+8,20,7);
      ctx.fillStyle=stripe; ctx.fillRect(x-2,y+11,20,2);           // blue waterline stripe
      ctx.fillStyle=shade; ctx.fillRect(x-2,y+14,20,1);
      // pointed bow
      ctx.fillStyle=white; ctx.fillRect(x+(bowRight?18:-5),y+9,3,4); ctx.fillStyle=dark; ctx.fillRect(x+(bowRight?20:-5),y+9,1,4);
      // small cabin/windshield
      ctx.fillStyle=shade; ctx.fillRect(x+5,y+5,6,3); ctx.fillStyle=trim; ctx.fillRect(x+6,y+6,4,1);
      // bow light
      ctx.fillStyle=on?"#fff2b0":trim; ctx.fillRect(x+(bowRight?18:-4),y+8,2,2);

  // Swimming: head at water level, arms doing strokes around the face, body hidden by water.

  function drawNpc(n,x,y){ x=Math.round(x); y=Math.round(y);
    const walking=!!(n.moving), frame=walking?(Math.floor((n.animT||0)*7)%2):0;
    const opt={skin:"#f0c890",hair:n.hairCol||n.colorDk,shirt:n.color,shirtDk:n.colorDk,pants:n.pants||n.colorDk,kind:n.kind||"ym",outfit:outfitFor(n)};
    if(n.bike){
      // cyclist over a bike
      ctx.fillStyle="#0a0a12"; ctx.fillRect(x+1,y+13,5,4); ctx.fillRect(x+10,y+13,5,4);
      ctx.fillStyle="#888"; ctx.fillRect(x+2,y+14,3,2); ctx.fillRect(x+11,y+14,3,2);
      ctx.fillStyle="#c0c0c8"; ctx.fillRect(x+4,y+13,8,1);
      drawHuman(x, y-2, n.dir||"right", false, 0, opt);

    }
    drawHuman(x, y, n.dir||"down", walking, frame, opt);
    if(n.fishing) drawRod(x,y,n.animT||0, n.dir||"down");

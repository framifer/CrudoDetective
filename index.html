  // Decide an NPC's outfit from its base role + current area + season.
  function outfitFor(n){
    const base=n.outfitBase||"";   // "", "worker","tirolese","hiker","lumberjack","vacation","skier"
    // fixed-role outfits (always worn)
    if(base==="worker") return "worker";
    if(base==="sailor") return "sailor";
    if(base==="hiker") return "hiker";
    if(base==="lumberjack") return "lumberjack";
    if(base==="skier") return "skier";
    if(base==="tirolese"){ return season==="winter" ? "coat" : "tirolese"; }
    if(base==="vacation"){
      if(season==="summer"||season==="spring") return "swim";
      if(season==="winter") return "coat";
      return ""; // autumn = normal clothes
    }
    // townsfolk (no base): coat in winter, else normal
    return season==="winter" ? "coat" : "";
  }
  // bobbing "!" marker over a quest NPC
  function drawQuestMark(x,y,kind){
    const bob=Math.floor(performance.now()/300)%2;
    const mx=x+6, my=y-9-bob;
    const isCase=(kind==="case");
    const body=isCase?"#ff2a2a":"#ffd020";        // vibrant red for the case, yellow for casual
    const hi=isCase?"#ff9a8a":"#fff2a0";
    ctx.fillStyle="#0a0a12"; ctx.fillRect(mx-1,my-1,5,9);          // outline
    ctx.fillStyle=body; ctx.fillRect(mx,my,3,5); ctx.fillRect(mx,my+6,3,2);  // ! body + dot
    ctx.fillStyle=hi; ctx.fillRect(mx,my,1,4);             // highlight
  }
  // Redraw all quest "!" markers ON TOP of the night overlay + fog, so they stay bright/legible
  // at any time of day (they are UI guidance, not part of the lit scene).
  function drawQuestMarksOverlay(){
    if(insideKey) return;
    const list = currentNpcs();
    for(const n of list){
      if(!n) continue;
      const qk = npcQuestKind(n); if(!qk) continue;
      const x = Math.round(n.px - cam.x), y = Math.round(n.py - cam.y);
      // skip if clearly off-screen
      if(x < -TILE || x > W+TILE || y < -TILE || y > H+TILE) continue;
      drawQuestMark(x, y, qk);
    }
  }
  // fishing rod + line into the water, pointing in the given direction ('left'=west, else 'down'=south)
  function drawRod(x,y,animT,dir){
    const bob=Math.floor((animT||0)*3)%2;
    ctx.fillStyle="#8a5a2a"; // rod
    if(dir==="left"){
      for(let i=0;i<10;i++) ctx.fillRect(x+3-i, y+6-Math.floor(i*0.8), 1,1);   // rod up-left
      ctx.fillStyle="#cfd6de"; ctx.fillRect(x-7, y+0, 1, 12+bob);              // line down at tip
      ctx.fillStyle="#e04040"; ctx.fillRect(x-8, y+12+bob, 2,2);               // float
    } else { // down/south
      for(let i=0;i<10;i++) ctx.fillRect(x+12+i, y+6-Math.floor(i*0.8), 1,1);
      ctx.fillStyle="#cfd6de"; ctx.fillRect(x+21, y+0, 1, 14+bob);
      ctx.fillStyle="#e04040"; ctx.fillRect(x+20, y+14+bob, 2,2);
    }
  }

  // Lighthouse on the SE cliff of Lighthouse Village; rotating beam, brighter at night.
  function drawLighthouse(x,y){
    x=Math.round(x); y=Math.round(y);
    const bx=x-4, by=y-30;
    // warm halo around the lantern, like the street lamps (stronger at night)

    ctx.fillStyle="rgba(255,224,150,"+(0.16*halo).toFixed(3)+")"; ctx.fillRect(lampx-13,lampy-10,26,26);
    ctx.fillStyle="rgba(255,240,190,"+(0.28*halo).toFixed(3)+")"; ctx.fillRect(lampx-6,lampy-5,12,12);
    // tower body (white with red bands)
    ctx.fillStyle="#0a0a12"; ctx.fillRect(bx-1,by-1,16,34);
    ctx.fillStyle="#e6e6ea"; ctx.fillRect(bx,by,14,32);
    ctx.fillStyle="#c83a3a"; ctx.fillRect(bx,by+6,14,4); ctx.fillRect(bx,by+16,14,4); ctx.fillRect(bx,by+26,14,4);
    ctx.fillStyle="#b0b0b8"; ctx.fillRect(bx,by,2,32);            // shading

  // ---- HUD ----
  function firstActiveQuest(){
    // priority: active main quests in order, then active side quests
    for(const k of QORDER){ const q=QUESTS[k]; if(q.status==="active" && q.type==="main") return q; }
    for(const k of QORDER){ const q=QUESTS[k]; if(q.status==="active") return q; }
    return null;
  }
  function activeQuestText(){
    const q=firstActiveQuest();
    if(q){
      let base=t(q.steps[q.step]);
      // For a red case quest whose clue isn't collected yet, add rich guidance:
      // destination area (with an arrow if you're elsewhere) + the pickup's location hint.
      if(q.type==="case" && typeof CASE_QUESTS!=="undefined" && CASE_QUESTS.has(q.id) && window.CASE_REF){
        const cq=window.CASE_REF.byId[q.id];
        const clue=window.CASE_REF.clues[q.id];
        const needClue = cq && cq.pickup && clue && !clue.taken;
        if(needClue){
          const destArea=cq.pickup.area;
          const hintKey="cs_"+q.id+"_hint"; const hint=t(hintKey);
          const parts=[base];
          if(destArea && destArea!==areaKey && !insideKey){
            const an=(t("area_"+destArea)||destArea);
            parts.push("\u25B6 "+an);   // ▶ go to this area
          }
          if(hint && hint!==hintKey) parts.push("("+hint+")");
          return parts.join("  ");
        }
      }
      return base;
    }
    // any available (not yet started) main quest?
    for(const k of QORDER){ const qq=QUESTS[k]; if(qq.status==="available"&&qq.type==="main") return t(qq.nameK); }
    return t("q_none");
  }

  function drawDialog(){ const bx=6,by=H-46,bw=W-12,bh=40; panelBox(bx,by,bw,bh);
    if(dialog.npc) text(t(dialog.npc.nameKey),bx+6,by+3,pal().accent);
    const full=dialog.lines[dialog.idx]||"";
    const shown=full.substring(0,Math.floor(dialog.reveal));
    ctx.font="8px monospace"; const maxW=bw-16;   // safe inner width
    // word-wrap; if a single word is still too wide, break it by characters
    function fitWords(str){
      const out=[]; let line="";
      const push=()=>{ if(line){ out.push(line); line=""; } };
      str.split(" ").forEach(w=>{
        // break overly long words
        while(ctx.measureText(w).width>maxW){ let cut=w.length; while(cut>1 && ctx.measureText(w.slice(0,cut)).width>maxW) cut--;
          const part=w.slice(0,cut); if(line){ push(); } out.push(part); w=w.slice(cut); }
        const test=line?line+" "+w:w;
        if(ctx.measureText(test).width>maxW){ push(); line=w; } else line=test;
      });
      if(line) out.push(line);
      return out;
    }
    const lines=fitWords(shown);
    const maxRows=3; let ly=by+15;
    lines.slice(0,maxRows).forEach(l=>{ text(l,bx+6,ly,"#f0f0e0"); ly+=10; });
    if(dialog.reveal>=full.length && Math.floor(performance.now()/400)%2===0) text((dialog.idx<dialog.lines.length-1)?"\u25BC":"\u25A0",bx+bw-14,by+bh-12,pal().accent); }

      const mw=rows[0].length, mh=rows.length; const sx=aw/mw, sy=ah/mh;
      const solidish="THRWCDABVSGJKMOZEFYilk";
      for(let ty=0;ty<mh;ty++){ const row=rows[ty]; for(let tx=0;tx<mw;tx++){ const c=row[tx];
        let col = c.match(/[1-9]/)?"#ffd860":(MINI_COL[c]||"#6a9a4a");
        ctx.fillStyle=col; ctx.fillRect(px0+tx*sx, py0+ty*sy, Math.ceil(sx), Math.ceil(sy));
        // detail: darken edges of buildings/structures for readability when zoomed
        if(big && solidish.indexOf(c)>=0){ ctx.fillStyle="rgba(0,0,0,0.28)"; ctx.fillRect(px0+tx*sx, py0+ty*sy+Math.max(1,sy-1), Math.ceil(sx), 1); }
      } }
    }
    function drawMarkers(areaKey2, px0, py0, aw, ah){
      const rows=AREAS[areaKey2]; const sx=aw/rows[0].length, sy=ah/rows.length;
      const pulse=0.6+0.4*Math.sin(performance.now()/220);   // smooth 0.2..1 glow (no hard blink)
      const list = areaKey2==="town" ? npcs : (AREA_NPCS[areaKey2]||[]);
      list.forEach(n=>{ const qk=npcQuestKind(n); if(!qk) return;
        const qx=px0+Math.round(n.px/TILE)*sx, qy=py0+Math.round(n.py/TILE)*sy;

        ctx.fillStyle="rgba("+(qk==="case"?"255,60,50":"255,220,60")+","+(0.35*pulse).toFixed(2)+")"; ctx.fillRect(qx-3,qy-3,7,7);  // soft glow halo
        ctx.fillStyle=glow; ctx.fillRect(qx-2,qy-2,5,5);      // outer
        ctx.fillStyle=core; ctx.fillRect(qx-1,qy-1,3,3);      // bright core
        ctx.fillStyle="#ffffff"; ctx.globalAlpha=pulse; ctx.fillRect(qx,qy,1,1); ctx.globalAlpha=1;   // white hot center
      });
      if(areaKey2===areaKey){ const pp=0.6+0.4*Math.sin(performance.now()/180); ctx.fillStyle="rgba(255,255,255,"+(0.5*pp).toFixed(2)+")"; ctx.fillRect(px0+player.tx*sx-2,py0+player.ty*sy-2,5,5); ctx.fillStyle="#fff"; ctx.fillRect(px0+player.tx*sx-1,py0+player.ty*sy-1,3,3); ctx.fillStyle="#3aa0ff"; ctx.fillRect(px0+player.tx*sx,py0+player.ty*sy,1,1); }
    }
    if(mapNav.zoom){
      // ---- ZOOM: single area rendered with the REAL world tiles, scaled to fit ----
      const rows=AREAS[mapNav.zoom];
      textCenter((t("area_"+mapNav.zoom)||mapNav.zoom),W/2,18,"#ffd840");
      const mw=rows[0].length, mh=rows.length;
      const aw=W-16, ah=H-46; const px0=8, py0=26;
      const s=Math.min(aw/(mw*TILE), ah/(mh*TILE));   // uniform scale to fit
      const dw=mw*TILE*s, dh=mh*TILE*s;
      const ox=px0+(aw-dw)/2, oy=py0+(ah-dh)/2;
      // clip to the map rect
      ctx.save(); ctx.beginPath(); ctx.rect(ox,oy,dw,dh); ctx.clip();
      ctx.translate(ox,oy); ctx.scale(s,s);
      // temporarily point cur + camera at this area so drawGround/drawObject read the right tiles
      const savRows=cur.rows, savW=cur.w, savH=cur.h, savCamX=cam.x, savCamY=cam.y;
      cur.rows=rows; cur.w=mw; cur.h=mh; cam.x=0; cam.y=0;
      const p=pal();
      for(let ty=0;ty<mh;ty++) for(let tx=0;tx<mw;tx++) drawGround(rows[ty][tx], tx*TILE, ty*TILE, tx, ty, p);
      for(let ty=0;ty<mh;ty++) for(let tx=0;tx<mw;tx++) drawObject(rows[ty][tx], tx*TILE, ty*TILE, tx, ty, p);
      cur.rows=savRows; cur.w=savW; cur.h=savH; cam.x=savCamX; cam.y=savCamY;
      ctx.restore();
      // markers + player blip in map space (on top of the scaled render)
      (function(){ const sx=dw/mw, sy=dh/mh; const pulse=0.6+0.4*Math.sin(performance.now()/220);
        const list=mapNav.zoom==="town"?npcs:(AREA_NPCS[mapNav.zoom]||[]);
        list.forEach(n=>{ const qk=npcQuestKind(n); if(!qk) return; const mx=ox+Math.round(n.px/TILE)*sx, my=oy+Math.round(n.py/TILE)*sy;
          const core=(qk==="case")?"#ff5040":"#ffe040", glow=(qk==="case")?"#ff2a2a":"#ffd020";
          ctx.fillStyle="rgba("+(qk==="case"?"255,60,50":"255,220,60")+","+(0.35*pulse).toFixed(2)+")"; ctx.fillRect(mx-4,my-4,9,9);
          ctx.fillStyle=glow; ctx.fillRect(mx-2,my-2,5,5); ctx.fillStyle=core; ctx.fillRect(mx-1,my-1,3,3);
          ctx.fillStyle="#ffffff"; ctx.globalAlpha=pulse; ctx.fillRect(mx,my,1,1); ctx.globalAlpha=1; });
        if(mapNav.zoom===areaKey){ const pp=0.6+0.4*Math.sin(performance.now()/180); ctx.fillStyle="rgba(255,255,255,"+(0.5*pp).toFixed(2)+")"; ctx.fillRect(ox+player.tx*sx-2,oy+player.ty*sy-2,5,5); ctx.fillStyle="#fff"; ctx.fillRect(ox+player.tx*sx-1,oy+player.ty*sy-1,3,3); ctx.fillStyle="#3aa0ff"; ctx.fillRect(ox+player.tx*sx,oy+player.ty*sy,1,1); }
      })();
      ctx.strokeStyle="#4a4a58"; ctx.lineWidth=1; ctx.strokeRect(ox-0.5,oy-0.5,dw+1,dh+1);
      textCenter(t("map_back"),W/2,H-22,"#c8c8d0");
      return;
    }
    // ---- GRID: all areas (3 cols x up to 3 rows; Open Sea sits at row 2) ----
    const gap=0, originX=12, originY=26;
    const cellW=Math.floor((W-24)/3), cellH=33;
    for(const k in AREA_GRID){ const p=k.split(","); const cx=parseInt(p[0]), cy=parseInt(p[1]); const areaKey2=AREA_GRID[k];
      const rows=AREAS[areaKey2]; if(!rows) continue;
      const px0=originX+cx*(cellW+gap), py0=originY+cy*(cellH+gap);
      const known=discovered.has(areaKey2);
      if(known){ drawAreaTiles(rows, px0, py0, cellW, cellH, false); }
      else { // fog of war: undiscovered area
        ctx.fillStyle="#0c0c14"; ctx.fillRect(px0,py0,cellW,cellH);
        ctx.fillStyle="#1a1a26"; for(let gy=0;gy<cellH;gy+=4) ctx.fillRect(px0,py0+gy,cellW,1);   // faint scanlines
        ctx.fillStyle="#4a4a5a"; ctx.font="8px monospace"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("???", px0+cellW/2, py0+cellH/2); ctx.textAlign="left"; ctx.textBaseline="top";
      }
      const isCur=(areaKey2===areaKey), isSel=(cx===mapNav.col && cy===mapNav.row);
      // only outline the cursor (selected) and the player's current area; no borders between areas
      if(isSel){ ctx.strokeStyle="#ffffff"; ctx.lineWidth=1; ctx.strokeRect(px0+0.5,py0+0.5,cellW-1,cellH-1); ctx.strokeRect(px0-0.5,py0-0.5,cellW+1,cellH+1); }
      else if(isCur){ ctx.strokeStyle="#ffd840"; ctx.lineWidth=1; ctx.strokeRect(px0+0.5,py0+0.5,cellW-1,cellH-1); }
      if(known){ ctx.font="6px monospace"; ctx.textBaseline="top"; ctx.fillStyle=isSel?"#fff":(isCur?"#ffd840":"#8a8a9a");
        ctx.fillText((t("area_"+areaKey2)||areaKey2).substring(0,11), px0+1, py0+1);
        drawMarkers(areaKey2, px0, py0, cellW, cellH); }
    }
    // full name of the area under the cursor
    const selKey=AREA_GRID[mapNav.col+","+mapNav.row];
    if(selKey) textCenter(discovered.has(selKey)?(t("area_"+selKey)||selKey):"???", W/2, 18, "#ffd840");
    textCenter(t("map_nav"),W/2,H-22,"#c8c8d0");
  }

  // ================= CENTRAL STORY LOADER (data-driven, from window.STORY_DATA) =================
  // Builds the detective case: quests (red markers), clue pickups, new NPCs and i18n strings
  // from the JSON produced offline. Casual quests stay untouched and separate.
  const CASE = { data:null, quests:[], byId:{}, order:[], clues:{}, closedUntil:{}, deduced:{}, reconstructed:{}, morals:{}, fought:{}, chaseCaught:{}, started:false, introDone:false };
  window.CASE_REF = CASE;
  (function loadStory(){
    const S = window.STORY_DATA, P = window.STORY_POS;
    if(!S || !S.quests){ return; }
    // --- inject the special "foot chase -> scooter reward" beat between case3 and case4 ---
    if(!S.quests.some(q=>q.id==="case_chase")){
      S.quests.push({ id:"case_chase", order:3.5, season:"autumn",
        title:{it:"Inseguimento a piedi",en:"The foot chase"},
        steps:[{it:"Insegui il sospetto in fuga",en:"Chase the fleeing suspect"},{it:"Raggiungilo prima che sparisca",en:"Catch him before he vanishes"}],
        start_banner:{it:"Un sospetto scappa! Inseguilo!",en:"A suspect is running! Chase him!"},
        done_banner:{it:"Preso! Il sindaco ti dona un motorino.",en:"Caught! The mayor gives you a scooter."},
        start_npc:"vito", complete_npc:"vito", chase:true });
      // dialogues for the chase beat (vito)
      S.dialogues.push({npc_id:"vito",quest_id:"case_chase",state:"start",lines:{it:["Quello scappa, detective!","E' lui, ne sono certo.","Corri, prendilo!"],en:["He's bolting, detective!","It's him, I'm sure.","Run, catch him!"]}});
      S.dialogues.push({npc_id:"vito",quest_id:"case_chase",state:"active",lines:{it:["Non farlo scappare!","E' andato verso","il centro!"],en:["Don't let him get away!","He headed toward","the centre!"]}});
      S.dialogues.push({npc_id:"vito",quest_id:"case_chase",state:"done",lines:{it:["Gran corsa, detective!","Il sindaco dice che ti","serve un mezzo. Tieni:","un motorino!"],en:["Great running, detective!","The mayor says you need","a ride. Here:","a scooter!"]}});
    }
    CASE.data = S;
    // 1) inject i18n strings for case quests + dialogues (keys namespaced with "cs_")
    function put(key, val){ if(val && val.it!==undefined) STR.it[key]=val.it; if(val && val.en!==undefined) STR.en[key]=val.en; }
    S.quests.forEach(q=>{
      put("cs_"+q.id+"_t", q.title);
      (q.steps||[]).forEach((st,i)=> put("cs_"+q.id+"_s"+i, st));
      put("cs_"+q.id+"_startb", q.start_banner);
      put("cs_"+q.id+"_doneb", q.done_banner);
      if(q.pickup && q.pickup.what) put("cs_"+q.id+"_clue", q.pickup.what);
      if(q.pickup && q.pickup.hint) put("cs_"+q.id+"_hint", q.pickup.hint);
    });
    // dialogues: key = cs_dlg_<npc>_<questId>_<state>
    S.dialogues.forEach(dl=>{ put("cs_dlg_"+dl.npc_id+"_"+dl.quest_id+"_"+dl.state, dl.lines); });
    // names for new npcs
    (S.new_npcs||[]).forEach(n=>{ if(n.name) put("cs_name_"+n.id, n.name); });

    // 2) build case quests into the engine (chained by order), mark them as CASE
    const sorted = S.quests.slice().sort((a,b)=>(a.order||0)-(b.order||0));
    sorted.forEach((q,idx)=>{
      const prev = idx>0 ? sorted[idx-1].id : null;
      QUESTS[q.id] = { id:q.id, chap:1, type:"case", nameK:"cs_"+q.id+"_t",
        steps:[ "cs_"+q.id+"_s0", "cs_"+q.id+"_s1" ], status:"locked", step:0, needs:prev,
        season:q.season, startNpc:q.start_npc, completeNpc:q.complete_npc,
        hasPickup: !!q.pickup, chase: !!q.chase };
      QORDER.push(q.id);
      CASE_QUESTS.add(q.id);
      CASE.order.push(q.id);
      CASE.byId[q.id] = q;
      // clue pickup state
      const pos = P && P.pickups && P.pickups[q.id];
      if(q.pickup && pos){ CASE.clues[q.id] = { area:pos[0], tx:pos[1], ty:pos[2], taken:false, animT:0 }; }
    });

    // 3) create the 3 new NPCs and place them
    const NPC_KIND = (look)=> look.age==="child" ? (look.sex==="f"?"girl":"boy") : (look.sex==="f"? (look.age==="old"?"ow":"yw") : (look.age==="old"?"om":"ym"));
    (S.new_npcs||[]).forEach(n=>{
      const pos = P && P.npc && P.npc[n.id];
      if(!pos) return;
      const [area,tx,ty]=pos;
      const lk = n.look || {};
      const npc = { id:n.id, tx:tx, ty:ty, dir:"down",
        color: lk.shirt || "#7a8290", colorDk: lk.shirtDk || "#4a5058", kind:NPC_KIND(lk), hairCol: lk.hair || "#3a2a1a",
        pants: lk.pants || "#3a3a44", outfitBase: lk.outfit || undefined, nameKey:"cs_name_"+n.id, caseNpc:true,
        lines:()=>{ const cl=caseLines(n.id); return cl || t("passerby_l"); }, onTalk:()=>caseOnTalk(n.id) };
      npc.px=npc.tx*TILE; npc.py=npc.ty*TILE;
      if(area==="town") npcs.push(npc);
      else { (AREA_NPCS[area]=AREA_NPCS[area]||[]).push(npc); }
    });

    // 4) attach a case hook to EXISTING npcs involved in the story (without breaking casual lines)
    const involved = new Set();
    sorted.forEach(q=>{ involved.add(q.start_npc); involved.add(q.complete_npc); });
    function hook(list){ list.forEach(npc=>{ if(!involved.has(npc.id) || npc.caseNpc) return;
      const casualLines = npc.lines, casualTalk = npc.onTalk;
      npc.lines = ()=>{ const cl=caseLines(npc.id); return cl || (casualLines?casualLines():[""]); };
      npc.onTalk = (nn)=>{ if(introActiveFor(npc.id) || caseActiveFor(npc.id)){ caseOnTalk(npc.id); } else if(casualTalk){ casualTalk(nn); } };
    }); }
    hook(npcs); Object.values(AREA_NPCS).forEach(hook);
  })();

  // Which case quest (if any) this npc can act on right now (start available or ready-to-complete).
  function caseClosed(id){ const u=CASE.closedUntil[id]; return (u!=null && dayCount < u); }
  function caseActiveFor(npcId){
    for(const id of CASE.order){ const q=QUESTS[id]; if(!q) continue;
      if(q.startNpc===npcId && (q.status==="available")) return {id, mode:"start"};
      if(q.completeNpc===npcId && q.status==="active" && caseClueReady(id)){
        return { id, mode: caseClosed(id) ? "closed" : "complete" };
      }
      if(q.startNpc===npcId && q.status==="active" && !caseClueReady(id)) return {id, mode:"active"};
    }
    return null;
  }
  function caseClueReady(id){ const q=QUESTS[id]; if(!q) return true;
    if(q.chase){ return !!(CASE.chaseCaught && CASE.chaseCaught[id]); }   // chase must be caught first
    if(!q.hasPickup) return true; const c=CASE.clues[id]; return c? c.taken : true; }
  // A red "!" is shown to start or to complete; a "closed until tomorrow" witness shows no marker.
  function caseNpcHasQuest(npc){ const a=caseActiveFor(npc.id); return !!a && (a.mode==="start"||a.mode==="complete"); }
  function caseLines(npcId){
    const il=introLines(npcId); if(il) return il;
    const a=caseActiveFor(npcId); if(!a) return null;
    if(a.mode==="closed"){ return vpick("interro_wait"); }
    const st = a.mode==="complete" ? "done" : (a.mode==="active"?"active":"start");
    const key="cs_dlg_"+npcId+"_"+a.id+"_"+st;
    const v=t(key); return (v===key)? null : v;
  }
  function caseOnTalk(npcId){
    if(introActiveFor(npcId)){ introOnTalk(npcId); return; }
    const a=caseActiveFor(npcId); if(!a) return;
    const q=QUESTS[a.id];
    if(a.mode==="start"){ if(q.season && season!==q.season) setSeason(q.season);
      qStart(a.id);
      if(q.chase){ startChase(a.id); }   // begin the foot chase immediately
      if(a.id==="case_isle1"){ islandUnlocked=true; }   // story opens the ship route to the island
      if(DISCOVER_ON_START[a.id]){ discoverArea(DISCOVER_ON_START[a.id]); }   // bridge quests reveal their target area
      saveGame(); }
    else if(a.mode==="closed"){ banner(vpick("interro_wait_b")); }
    else if(a.mode==="complete"){
      if(q.chase){   // chase caught -> complete + grant the scooter
        qComplete(a.id); banner(t("cs_"+a.id+"_doneb"));
        scooterUnlocked=true; SFX.unlock(); if(typeof sqActivate==="function") sqActivate(); showExamine([t("scooter_reward0"),t("scooter_reward1"),t("scooter_reward2")]);
        saveGame(); afterCaseComplete(a.id); return;
      }
      if(q.hasPickup){
        // climax beats use the phased CONFRONT; others use the simple interrogation
        const finishBeat = ()=>{
          if(CONFRONT_SNODI[a.id]){ startCaseConfront(a.id); }
          else { startInterrogation(a.id); }
        };
        // gate chain on key beats: reconstruction -> deduction -> confront/interrogation
        const runDeductionThen = ()=>{
          if(DEDUCTION_SNODI[a.id] && !CASE.deduced[a.id]){ startDeduction(a.id, finishBeat); }
          else { finishBeat(); }
        };
        const runReconThen = ()=>{
          if(RECON_SNODI[a.id] && !CASE.reconstructed[a.id]){ startReconstruction(a.id, runDeductionThen); }
          else { runDeductionThen(); }
        };
        // scripted fight first (rare, only on FIGHT_SNODI), if not already won
        if(FIGHT_SNODI[a.id] && !CASE.fought[a.id]){ startFight(a.id, ()=>{ CASE.fought[a.id]=true; saveGame(); runReconThen(); }); }
        else { runReconThen(); }
      }
      else { qComplete(a.id); banner(t("cs_"+a.id+"_doneb")); saveGame(); afterCaseComplete(a.id); }
    }
  }
  // ---- MORAL CHOICES + ENDING: called after a case quest completes ----
  const MORAL_SNODI = { case5:1, case10:1 };   // intermediate moral dilemmas (recorded, affect the ending)
  const DISCOVER_ON_START = { case_disc1:"holiday", case_disc2:"forestNW", case_disc3:"cape" };   // bridge quests reveal these areas
  const FINAL_ID = "case14";
  function afterCaseComplete(id){
    if(MORAL_SNODI[id] && !(CASE.morals && CASE.morals[id])){ moralChoice(id); return; }
    if(id===FINAL_ID){ showEnding(); return; }
  }
  // ---- CONFRONT beats (verbal boss): climax quests ----
  const CONFRONT_SNODI = { case4:1, case9:1, case14:1 };
  // ---- FIGHT beats (rare scripted Zelda-like duels) ----
  const FIGHT_SNODI = { case3:1, case12:1, case11b:1, case13b:1 };
  function startCaseConfront(id){
    // good proofs = this quest's clue + the deduction-linked clue (if any)
    const good=[id]; if(DEDUCTION_SNODI[id]) good.push(DEDUCTION_SNODI[id]);
    startConfront(id, good,
      ()=>{ qComplete(id); banner(t("cs_"+id+"_doneb")); saveGame(); afterCaseComplete(id); },   // win
      ()=>{ CASE.closedUntil[id]=dayCount+1; showExamine(vpick("interro_fail")); saveGame(); }     // lose -> tomorrow
    );
  }
  function moralChoice(id){
    // a themed detective dilemma; the specific pick is recorded and read by the ending
    const opts=[
      { label:t("moral_"+id+"_a"), key:"A" },
      { label:t("moral_"+id+"_b"), key:"B" }
    ];
    askChoice(t("moral_"+id+"_q"), opts, (i,opt)=>{
      if(!CASE.morals) CASE.morals={}; CASE.morals[id]=opt.key;
      showExamine(vpick("moral_after")); saveGame();
    });
  }
  function showEnding(){
    // ending variant based on accumulated moral choices (justice-leaning vs mercy-leaning)
    const m=CASE.morals||{};
    let score=0; Object.keys(MORAL_SNODI).forEach(k=>{ if(m[k]==="A") score++; else if(m[k]==="B") score--; });
    const variant = score>0 ? "just" : (score<0 ? "mercy" : "grey");
    const lines=[].concat(t("ending_"+variant+"_0"),t("ending_"+variant+"_1"),t("ending_"+variant+"_2"));
    // after the ending, a closing message: the case is solved, but the town always needs Crudo (yellow quests go on)
    showExamine(lines, ()=>{ showExamine([t("case_solved_0"),t("case_solved_1"),t("case_solved_2")]); });
  }
  // ---- SCENE RECONSTRUCTION: order the last few clues chronologically before proceeding ----
  const RECON_SNODI = { case2:2, case6:3, case11:3, case9b:3, case_cape1:2 };   // value = how many previous clues to include (plus this one)
  function startReconstruction(id, after){
    const idx=CASE.order.indexOf(id);
    const n=RECON_SNODI[id]||3;
    // chronology = the ids from (idx-n) .. idx that have a collected clue, in true order
    const chrono=[];
    for(let j=Math.max(0,idx-n); j<=idx; j++){ const k=CASE.order[j]; const c=CASE.clues[k]; if(c&&c.taken){ const d=t("cs_"+k+"_clue"); if(d!=="cs_"+k+"_clue") chrono.push({key:k,label:trim(d)}); } }
    runReconstruction(chrono, ()=>{ CASE.reconstructed[id]=true; if(after) after(); }, null);
  }
  // Generic reconstruction core. items = [{key,label}] IN THE CORRECT chronological order.
  function runReconstruction(items, onWin, onFail){
    const correctOrder=items.map(x=>x.key);
    const picked=[];
    function step(){
      const remaining=items.filter(x=>!picked.includes(x.key));
      if(remaining.length===0){
        if(picked.join(",")===correctOrder.join(",")){ showExamine(vpick("recon_ok"), ()=>{ if(onWin) onWin(); }); saveGame(); }
        else { picked.length=0; showExamine(vpick("recon_no"), ()=>{ if(onFail) onFail(); }); }
        return;
      }
      const title = picked.length===0 ? vpick("recon_first") : vpick("recon_next");
      askChoice(title, remaining.map(x=>({label:x.label, key:x.key})), (i,opt)=>{ picked.push(opt.key); step(); });
    }
    step();
  }
  // ---- DEDUCTIONS: on 3 key beats, connect two clues before interrogating ----
  // For each snodo: the correct pair is [this quest's clue, the previous quest's clue].
  const DEDUCTION_SNODI = { case4:"case3", case9:"case8", case14:"case13", case6b:"case3" };
  function startDeduction(id, after){
    const prev = DEDUCTION_SNODI[id];
    const clueA = t("cs_"+id+"_clue");     // just collected for this beat
    const clueB = t("cs_"+prev+"_clue");   // collected earlier
    // build the pool of collected clues as options
    const pool=[];
    (CASE.order||[]).forEach(k=>{ const c=CASE.clues[k]; if(c&&c.taken){ const d=t("cs_"+k+"_clue"); if(d!=="cs_"+k+"_clue") pool.push({id:k,label:trim(d)}); } });
    // step 1: pick the first clue
    askChoice(vpick("deduce_q1"), pool.map(p=>({label:p.label, key:p.id})), (i1,o1)=>{
      // step 2: pick the second clue (exclude the first)
      const pool2=pool.filter(p=>p.id!==o1.key);
      askChoice(vpick("deduce_q2"), pool2.map(p=>({label:p.label, key:p.id})), (i2,o2)=>{
        const picked=[o1.key,o2.key].sort().join(",");
        const correct=[id,prev].sort().join(",");
        if(picked===correct){ CASE.deduced[id]=true; showExamine(vpick("deduce_ok"), ()=>{ if(after) after(); }); saveGame(); }
        else { showExamine(vpick("deduce_no")); }
      });
    });
  }
  // Interrogation: show the witness the right clue from the notebook to make them talk.
  function startInterrogation(id){
    const correctLabel = t("cs_"+id+"_clue");
    const others=[];
    (CASE.order||[]).forEach(k=>{ if(k===id) return; const c=CASE.clues[k]; if(c&&c.taken){ const d=t("cs_"+k+"_clue"); if(d!=="cs_"+k+"_clue") others.push(d); } });
    for(let i=others.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [others[i],others[j]]=[others[j],others[i]]; }
    const distract=others.slice(0,2);
    let opts=[{label:trim(correctLabel),correct:true}].concat(distract.map(d=>({label:trim(d),correct:false})));
    for(let i=opts.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }
    askChoice(vpick("interro_q"), opts, (idx,opt)=>{
      if(opt.correct){ banner(vpick("interro_ok")); qComplete(id); banner(t("cs_"+id+"_doneb")); saveGame(); afterCaseComplete(id); }
      else {
        // wrong clue: the witness clams up until the next day -> must let a night pass
        CASE.closedUntil[id]=dayCount+1;
        showExamine(vpick("interro_fail"));
        saveGame();
      }
    });
  }
  function trim(s){ s=String(s); return s.length>26? s.slice(0,25)+"\u2026" : s; }
  // clue pickups: draw + collect
  function currentClues(){ const out=[]; for(const id of CASE.order){ const q=QUESTS[id]; const c=CASE.clues[id];
    if(TAIL_SNODI[id]) continue;   // tail beats: clue obtained by shadowing, not by pickup
    if(c && !c.taken && q.status==="active" && c.area===areaKey) out.push({id,c}); } return out; }
  function tryPickupClue(fx,fy){
    for(const {id,c} of currentClues()){
      if(fx===c.tx && fy===c.ty){
        c.taken=true; SFX.pickup();
        const d=t("cs_"+id+"_clue"); const desc=(d==="cs_"+id+"_clue")?"...":d;
        // examine the scene: a short detective note, then log it in the notebook
        const lines=[vpick("examine")].concat(wrapLines(desc,22));
        showExamine(lines, ()=>{ banner(t("clue_logged")+" "+desc); saveGame(); });
        return true;
      }
    }
    return false;
  }
  // wrap a string into short lines of at most maxChars characters (word-aware)
  function wrapLines(str, maxChars){
    const words=String(str).split(" "); const out=[]; let line="";
    words.forEach(w=>{ const test=line?line+" "+w:w; if(test.length>maxChars){ if(line) out.push(line); line=w; } else line=test; });
    if(line) out.push(line);
    return out.length?out:[""];
  }
  // ---- SHADOWING / TAIL (light stealth): follow a suspect without being noticed ----
  const TAIL_SNODI = { case7: { area:"holiday", from:[1,0], to:[43,31], speed:16 }, case2b: { area:"town", from:[1,0], to:[43,31], speed:15 }, case_isle2: { area:"island", from:[13,20], to:[25,22], speed:14 }, case_disc2: { area:"forestNW", from:[43,39], to:[32,1], speed:15 } };
  const tail = { active:false, id:null, target:null, suspicion:0, msg:"", msgT:0 };
  const TAIL_MIN=2, TAIL_MAX=6;   // keep between 2 and 6 tiles
  function tailPossibleFor(id){ return !!TAIL_SNODI[id] && QUESTS[id] && QUESTS[id].status==="active" && CASE.clues[id] && !CASE.clues[id].taken; }
  function maybeStartTail(){
    if(tail.active) return;
    for(const id of CASE.order){ if(tailPossibleFor(id)){ const cfg=TAIL_SNODI[id]; if(areaKey===cfg.area){ startTail(id); return; } } }
  }
  function startTail(id){
    const cfg=TAIL_SNODI[id];
    tail.active=true; tail.id=id; tail.suspicion=0; tail.msg=t("tail_intro"); tail.msgT=2.4;
    tail.target={ px:cfg.from[0]*TILE, py:cfg.from[1]*TILE, dir:"down", animT:0,
                  dest:cfg.to.slice(), speed:cfg.speed||16, path:null, replan:0, tgt:null };
  }
  function endTail(win){
    const id=tail.id;
    const cbWin=tail._onWin, cbFail=tail._onFail;
    tail.active=false; tail.target=null; tail._onWin=null; tail._onFail=null;
    if(id===null){   // casual side-quest tail (self-contained)
      if(win){ showExamine([t("tail_ok")], cbWin||null); } else { showExamine(vpick("interro_fail"), cbFail||null); }
      return;
    }
    if(win){ if(CASE.clues[id]) CASE.clues[id].taken=true; const d=t("cs_"+id+"_clue"); showExamine([t("tail_ok")].concat(wrapLines((d==="cs_"+id+"_clue"?"...":d),22)), ()=>{ banner(t("clue_logged")+" "+d); saveGame(); }); }
    else { CASE.closedUntil[id]=dayCount+1; showExamine(vpick("interro_fail")); saveGame(); }
  }
  function updateTail(dt){
    const tg=tail.target; if(!tg) return;
    if(tail.msgT>0) tail.msgT-=dt;
    const cx=Math.round(tg.px/TILE), cy=Math.round(tg.py/TILE);
    if(tg.tgt && !(Math.abs(tg.px-tg.tgt[0]*TILE)<0.6 && Math.abs(tg.py-tg.tgt[1]*TILE)<0.6)){
      const tX=tg.tgt[0]*TILE, tY=tg.tgt[1]*TILE, sp=tg.speed*dt;
      if(tg.px<tX){tg.px=Math.min(tX,tg.px+sp);tg.dir="right";} else if(tg.px>tX){tg.px=Math.max(tX,tg.px-sp);tg.dir="left";}
      if(tg.py<tY){tg.py=Math.min(tY,tg.py+sp);tg.dir="down";} else if(tg.py>tY){tg.py=Math.max(tY,tg.py-sp);tg.dir="up";}
      tg.animT+=dt;
    } else {
      tg.px=cx*TILE; tg.py=cy*TILE; tg.tgt=null;
      if(cx===tg.dest[0] && cy===tg.dest[1]){ endTail(tail.suspicion<100); return; }
      tg.replan-=dt;
      if(!tg.path || tg.path.length===0 || tg.replan<=0){ tg.path=bfsPath(cx,cy,tg.dest[0],tg.dest[1]); tg.replan=2.0; }
      if(tg.path && tg.path.length){ tg.tgt=tg.path.shift(); }
      else { endTail(tail.suspicion<100); return; }
    }
    const dist=Math.abs(cx-player.tx)+Math.abs(cy-player.ty);
    if(dist<TAIL_MIN){ tail.suspicion=Math.min(100, tail.suspicion+dt*40); }
    else if(dist>TAIL_MAX){ tail.suspicion=Math.min(100, tail.suspicion+dt*22); }
    else { tail.suspicion=Math.max(0, tail.suspicion-dt*18); }
    if(tail.suspicion>=100){ endTail(false); }
  }
  function drawTail(){
    const tg=tail.target; if(!tg) return;
    drawHuman(tg.px-cam.x, tg.py-cam.y, tg.dir, true, Math.floor(tg.animT*6)%2, {skin:"#f0c890",hair:"#2a2018",shirt:"#3a3a44",shirtDk:"#26262e",pants:"#22222a",kind:"ym"});
  }
  function drawTailUI(){
    text(t("tail_label"), 8, 6, "#ff8a6a");
    ctx.fillStyle="#0a0a12"; ctx.fillRect(7,15,W-12,8); ctx.fillStyle="#3a1e1e"; ctx.fillRect(8,16,W-16,6);
    ctx.fillStyle="#d83a3a"; ctx.fillRect(8,16,Math.round((W-16)*tail.suspicion/100),6);
    if(tail.msgT>0){ panelBox(6,H-22,W-12,18); textCenter(tail.msg,W/2,H-18,pal().accent); }
  }
  // ---- FOOT CHASE: catch the fleeing suspect (reach within 1 tile) before he escapes ----
  const chase = { active:false, id:null, target:null, msg:"", msgT:0 };
  function startChase(id){
    // suspect flees across town from near vito toward the far edge
    chase.active=true; chase.id=id; chase.msg=t("chase_intro"); chase.msgT=2.4;
    chase.target={ px:34*TILE, py:16*TILE, dir:"down", animT:0, dest:[2,2], speed:52, path:null, replan:0, tgt:null, escaped:0 };
    if(player.scooter){ player.scooter=false; SFX.scooterStop(); }   // on foot only
  }
  function endChase(caught){
    const id=chase.id; const cbW=chase._onWin, cbF=chase._onFail; chase.active=false; chase.target=null; chase._onWin=null; chase._onFail=null;
    if(id===null){   // casual scooter chase
      if(caught){ showExamine([t("chase_caught")], cbW||null); } else { showExamine([t("chase_lost0"),t("chase_lost1")], cbF||null); }
      saveGame(); return;
    }
    if(caught){ if(!CASE.chaseCaught) CASE.chaseCaught={}; CASE.chaseCaught[id]=true; showExamine([t("chase_caught")]); saveGame(); }
    else { showExamine([t("chase_lost0"),t("chase_lost1")]); saveGame(); }   // try again: re-talk to vito
  }
  function updateChase(dt){
    const tg=chase.target; if(!tg) return;
    if(chase.msgT>0) chase.msgT-=dt;
    // reached by player?
    const cx=Math.round(tg.px/TILE), cy=Math.round(tg.py/TILE);
    if(Math.abs(cx-player.tx)+Math.abs(cy-player.ty)<=1){ endChase(true); return; }
    // move suspect toward destination
    if(tg.tgt && !(Math.abs(tg.px-tg.tgt[0]*TILE)<0.6 && Math.abs(tg.py-tg.tgt[1]*TILE)<0.6)){
      const tX=tg.tgt[0]*TILE, tY=tg.tgt[1]*TILE, sp=tg.speed*dt;
      if(tg.px<tX){tg.px=Math.min(tX,tg.px+sp);tg.dir="right";} else if(tg.px>tX){tg.px=Math.max(tX,tg.px-sp);tg.dir="left";}
      if(tg.py<tY){tg.py=Math.min(tY,tg.py+sp);tg.dir="down";} else if(tg.py>tY){tg.py=Math.max(tY,tg.py-sp);tg.dir="up";}
      tg.animT+=dt;
    } else {
      tg.px=cx*TILE; tg.py=cy*TILE; tg.tgt=null;
      if(cx===tg.dest[0] && cy===tg.dest[1]){ endChase(false); return; }   // escaped
      tg.replan-=dt;
      if(!tg.path || tg.path.length===0 || tg.replan<=0){ tg.path=bfsPath(cx,cy,tg.dest[0],tg.dest[1]); tg.replan=1.5; }
      if(tg.path && tg.path.length){ tg.tgt=tg.path.shift(); } else { endChase(false); return; }
    }
  }
  function drawChase(){
    const tg=chase.target; if(!tg) return;
    // fleeing suspect (dark, hurried)
    drawHuman(tg.px-cam.x, tg.py-cam.y, tg.dir, true, Math.floor(tg.animT*8)%2, {skin:"#e0b080",hair:"#1a1a1a",shirt:"#4a2a2a",shirtDk:"#301818",pants:"#22222a",kind:"ym"});
    // "!" over him
    ctx.fillStyle="#ff2a2a"; ctx.fillRect(tg.px-cam.x+6, tg.py-cam.y-8, 2,4); ctx.fillRect(tg.px-cam.x+6, tg.py-cam.y-2, 2,2);
  }
  function drawChaseUI(){
    if(chase.msgT>0){ panelBox(6,H-22,W-12,18); textCenter(chase.msg,W/2,H-18,pal().accent); }
    else textCenter(t("chase_hint"),W/2,H-12,"#ffd0d0");
  }
  function drawClue(x,y){
    // small glowing evidence marker (folded paper / object)
    ctx.fillStyle="#0a0a12"; ctx.fillRect(x+4,y+6,8,7);
    ctx.fillStyle="#d8d0b0"; ctx.fillRect(x+5,y+7,6,5);
    ctx.fillStyle="#b83028"; ctx.fillRect(x+5,y+7,6,1);
    if(Math.floor(performance.now()/300)%2===0){ ctx.fillStyle="#ffcf50"; ctx.fillRect(x+7,y+4,2,2); }
  }

  // ---- INTRO (casual, yellow): Crudo arrives; marinaio sends him to the widow; talking to her
  //      completes the intro and unlocks the case + the casual quests. ----
  const INTRO = { startNpc:"marinaio", endNpc:"vedova" };
  function introActiveFor(npcId){
    const q=QUESTS.intro; if(!q) return null;
    if(npcId===INTRO.startNpc && q.status==="available") return "start";
    if(npcId===INTRO.startNpc && q.status==="active") return "active";
    if(npcId===INTRO.endNpc && q.status==="active") return "end";
    return null;
  }
  function introLines(npcId){
    const m=introActiveFor(npcId); if(!m) return null;
    const key = m==="end" ? "intro_end" : (m==="active" ? "intro_wait" : "intro_start");
    const v=t(key); return (v===key)? null : v;
  }
  function introOnTalk(npcId){
    const m=introActiveFor(npcId); if(!m) return false;
    if(m==="start"){ qStart("intro"); saveGame(); return true; }
    if(m==="end"){ qComplete("intro"); unlockCasualQuests(); unlockAfterIntro(); banner(t("intro_done")); saveGame(); return true; }
    return true; // "active": marinaio just repeats, no state change
  }
  function introNpcHasMark(npcId){ const m=introActiveFor(npcId); return m==="start"||m==="end"; }
  function unlockAfterIntro(){
    if(CASE.introDone) return; CASE.introDone=true;
    const first = CASE.order[0]; if(first && QUESTS[first]) QUESTS[first].status="available";
    if(typeof sqActivate==="function") sqActivate();   // unlock casual side-quests now
    saveGame();
  }

  // ================= SIDE-QUEST SLOT ENGINE (casual yellow quests, self-contained) =================
  const SQ_KINDS = ["recon","morale","confront","tail","fight","scooter","courier"];
  const SLOTS_PER_KIND = 1;   // one active side-quest per kind at a time (6 kinds pre-scooter, 7 after unlock),
                              // rotated by the slot engine. While one yellow is ACCEPTED/in progress
                              // (SQ.acceptedNpc set) all OTHER yellow markers hide, in-game and on the map.
  const SQ = { pool:{}, queueIdx:{}, active:[], done:{}, byNpc:{}, acceptedNpc:null };
  SQ_KINDS.forEach(k=>{ SQ.pool[k]=[]; SQ.queueIdx[k]=0; });
  function sqLoadPool(){
    const src = window.SIDEQUESTS || null;
    if(src){ SQ_KINDS.forEach(k=>{ SQ.pool[k] = (src[k]||[]).slice(); }); return; }
    SQ_KINDS.forEach(k=>{ SQ.pool[k]=[]; for(let i=0;i<4;i++){ SQ.pool[k].push({ id:k+"_ph"+i, kind:k, title:{it:k+" #"+i, en:k+" #"+i}, giver:{it:["..."],en:["..."]} }); } });
  }
  function sqCandidateNpcs(area){
    const all=[];
    if(!area || area==="town"){ npcs.forEach(n=>{ if(n) n._area="town"; all.push(n); }); }
    for(const ak in AREA_NPCS){ (AREA_NPCS[ak]||[]).forEach(n=>{ if(n){ n._area=ak; all.push(n); } }); }
    let list = all.filter(n=> n && n.id && !n.caseNpc && !n.fishing);
    if(area) list = list.filter(n=> n._area===area);
    return list;
  }
  function npcBusy(npcId){
    if(typeof caseActiveFor==="function" && caseActiveFor(npcId)) return true;
    if(typeof introActiveFor==="function" && introActiveFor(npcId)) return true;
    if(SQ.byNpc[npcId]) return true;
    return false;
  }
  function sqActivate(){
    // casual side-quests unlock only AFTER the intro is completed
    if(!(window.CASE_REF && window.CASE_REF.introDone)) return;
    SQ_KINDS.forEach(kind=>{
      if(kind==="scooter" && !scooterUnlocked) return;   // scooter missions only after unlock
      let activeOfKind = SQ.active.filter(m=>m.kind===kind).length;
      while(activeOfKind < SLOTS_PER_KIND && SQ.queueIdx[kind] < SQ.pool[kind].length){
        const m = SQ.pool[kind][SQ.queueIdx[kind]++];
        if(SQ.done[m.id]) continue;
        let npcId = m.npcId;
        if(!npcId || npcBusy(npcId)){
          // prefer a free NPC in the mission's own area, else any free NPC
          let free = sqCandidateNpcs(m.area).find(n=>!npcBusy(n.id));
          if(!free) free = sqCandidateNpcs().find(n=>!npcBusy(n.id));
          if(!free){ SQ.queueIdx[kind]--; break; }
          npcId = free.id;
        }
        m._npc = npcId; SQ.byNpc[npcId]=m; SQ.active.push(m); activeOfKind++;
      }
    });
  }
  function sqNpcMission(npcId){ return SQ.byNpc[npcId] || null; }
  function sqComplete(m){
    SQ.done[m.id]=true; SQ.active = SQ.active.filter(x=>x!==m); if(m._npc) delete SQ.byNpc[m._npc];
    saveGame(); sqActivate();
  }
  // true if a casual side-quest activity is currently in progress (one yellow at a time)
  function sqBusy(){
    if(typeof courier!=="undefined" && courier.active) return true;
    if(typeof scDeliv!=="undefined" && scDeliv.active) return true;
    if(tail.active && tail.id===null) return true;      // a casual tail is running
    if(chase.active && chase.id===null) return true;    // a casual scooter chase is running
    if(confront.active || fight.active || choice.active || fishing.active) return true;
    return false;
  }
  function sqStart(m){
    if(sqBusy() || SQ.acceptedNpc){ banner(t("sq_busy")); return; }   // finish the current yellow quest first
    // mark this yellow quest as accepted/in-progress: hides ALL other yellow markers (game + map)
    SQ.acceptedNpc = m._npc || null;
    const release = ()=>{ SQ.acceptedNpc=null; };
    const win = ()=>{ release(); banner(t("sq_done")); sqComplete(m); };
    const fail = (msgKey)=>{ release(); banner(t(msgKey||"sq_fail")); saveGame(); };
    if(m.kind==="morale"){
      askChoice((m.q&&m.q[lang])||"...", [ {label:(m.a&&m.a[lang])||"A",key:"A"}, {label:(m.b&&m.b[lang])||"B",key:"B"} ], ()=>{ showExamine(vpick("moral_after"), win); });
    } else if(m.kind==="recon"){
      const items=(m.events||[]).map((e,i)=>({key:"e"+i, label:trim((e[lang]||e.it||"")) }));
      runReconstruction(items, win, ()=>fail());
    } else if(m.kind==="confront"){
      const opts=(m.args||[]).map(a=>({label:trim((a.t&&a.t[lang])||""), good:!!a.good}));
      confront.caseId=null;
      runConfront(opts, win, ()=>fail(), (m.intro&&m.intro[lang]));
    } else if(m.kind==="tail"){
      runTailCfg(m.tail, win, ()=>fail());
    } else if(m.kind==="fight"){
      startFight("sq_"+m.id, win);
    } else if(m.kind==="scooter"){
      if(m.sub==="chase"){ startScChase(m, win, ()=>fail()); }
      else { startScDelivery(m, win, ()=>fail()); }
    } else if(m.kind==="courier"){
      startCourier(m, win, ()=>fail());
    } else { win(); }
  }
  // ---- scooter side-quest: timed delivery (reach the target before time runs out) ----
  const scDeliv={ active:false, tx:0, ty:0, t:0, onWin:null, onFail:null, msg:"", msgT:0 };
  function startScDelivery(m, onWin, onFail){
    if(!player.scooter){ banner(t("sc_needscooter")); if(onFail) onFail(); return; }
    scDeliv.active=true; scDeliv.tx=m.to[0]; scDeliv.ty=m.to[1]; scDeliv.t=m.time||26; scDeliv.onWin=onWin; scDeliv.onFail=onFail;
    scDeliv.msg=t("sc_go"); scDeliv.msgT=2.0;
  }
  function updateScDelivery(dt){
    if(!scDeliv.active) return;
    if(scDeliv.msgT>0) scDeliv.msgT-=dt;
    if(!player.scooter){ scDeliv.active=false; showExamine([t("sc_gotoff")], scDeliv.onFail); return; }  // got off -> fail
    scDeliv.t-=dt;
    if(Math.abs(player.tx-scDeliv.tx)+Math.abs(player.ty-scDeliv.ty)<=1){ scDeliv.active=false; showExamine([t("sc_delivered")], scDeliv.onWin); return; }
    if(scDeliv.t<=0){ scDeliv.active=false; showExamine([t("sc_toolate")], scDeliv.onFail); return; }
  }
  function drawScDeliveryUI(){
    if(!scDeliv.active) return;
    // timer bar + target arrow hint
    text(t("sc_label"),8,6,"#ffd0d0");
    ctx.fillStyle="#0a0a12"; ctx.fillRect(7,15,W-12,8); ctx.fillStyle="#1e2a3a"; ctx.fillRect(8,16,W-16,6);
    const frac=Math.max(0,Math.min(1,scDeliv.t/26)); ctx.fillStyle=frac<0.3?"#d83a3a":"#3a8ad0"; ctx.fillRect(8,16,Math.round((W-16)*frac),6);
    if(scDeliv.msgT>0){ panelBox(6,H-22,W-12,18); textCenter(scDeliv.msg,W/2,H-18,pal().accent); }
  }
  // ---- COURIER side-quest: cross-map timed delivery on foot (reach a target in ANOTHER area) ----
  const courier={ active:false, area:"", tx:0, ty:0, t:0, tmax:1, onWin:null, onFail:null, msg:"", msgT:0 };
  function startCourier(m, onWin, onFail){
    courier.active=true; courier.area=m.to[0]; courier.tx=m.to[1]; courier.ty=m.to[2];
    courier.t=m.time||70; courier.tmax=m.time||70; courier.onWin=onWin; courier.onFail=onFail;
    courier.msg=t("cr_go"); courier.msgT=2.4;
  }
  function updateCourier(dt){
    if(!courier.active) return;
    if(courier.msgT>0) courier.msgT-=dt;
    courier.t-=dt;
    if(areaKey===courier.area && !insideKey && Math.abs(player.tx-courier.tx)+Math.abs(player.ty-courier.ty)<=1){
      courier.active=false; showExamine([t("cr_done")], courier.onWin); return;
    }
    if(courier.t<=0){ courier.active=false; showExamine([t("cr_toolate")], courier.onFail); return; }
  }
  function drawCourierUI(){
    if(!courier.active) return;
    text(t("cr_label"),8,6,"#ffe0a0");
    ctx.fillStyle="#0a0a12"; ctx.fillRect(7,15,W-12,8); ctx.fillStyle="#3a2e1a"; ctx.fillRect(8,16,W-16,6);
    const frac=Math.max(0,Math.min(1,courier.t/courier.tmax)); ctx.fillStyle=frac<0.3?"#d83a3a":"#e0a840"; ctx.fillRect(8,16,Math.round((W-16)*frac),6);
    // destination hint (area name), and whether you are in the right area
    const dest=(t("area_"+courier.area)||courier.area);
    const here=(areaKey===courier.area);
    if(courier.msgT>0){ panelBox(6,H-22,W-12,18); textCenter(courier.msg,W/2,H-18,pal().accent); }
    else { panelBox(6,H-22,W-12,18); textCenter((here?t("cr_here"):t("cr_to")+" "+dest),W/2,H-18, here?"#7ae06a":pal().accent); }
  }
  // ---- scooter side-quest: chase (catch the fleeing target while on the scooter) ----
  function startScChase(m, onWin, onFail){
    chase.active=true; chase.id=null; chase.msg=t("chase_intro"); chase.msgT=2.4; chase._onWin=onWin; chase._onFail=onFail;
    chase.target={ px:m.from[0]*TILE, py:m.from[1]*TILE, dir:"down", animT:0, dest:m.to.slice(), speed:m.speed||70, path:null, replan:0, tgt:null };
  }
  function runTailCfg(cfg, onWin, onFail){
    tail.active=true; tail.id=null; tail.suspicion=0; tail.msg=t("tail_intro"); tail.msgT=2.4;
    tail._onWin=onWin; tail._onFail=onFail;
    tail.target={ px:cfg.from[0]*TILE, py:cfg.from[1]*TILE, dir:"down", animT:0, dest:cfg.to.slice(), speed:cfg.speed||16, path:null, replan:0, tgt:null };
  }
  function serializeSQ(){ return { done:SQ.done, qi:SQ.queueIdx }; }
  function restoreSQ(o){ if(!o) return; if(o.done) SQ.done=o.done; if(o.qi) SQ.queueIdx=o.qi; }
  function sqInit(){ sqLoadPool(); SQ.active=[]; SQ.byNpc={}; SQ.acceptedNpc=null; sqActivate(); }
  window.SQ_REF = SQ;

  // ================= LOOP =================
  let last=performance.now();
  function loop(now){ let dt=(now-last)/1000; last=now; if(dt>0.1) dt=0.1; SFX.setTempoScale(1.0); update(dt); draw(); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>
</body>
